<!doctype html>
<!--
  Ancienne adresse de TAC Vélo (site de Julien, mécanicien vélo), du 10 au 14/11/2026.
  Depuis le 14/11/2026, le site est sur son propre domaine : https://tac-velo.fr/
  (dépôt svaug12345/tac-velo). Cette page renvoie automatiquement là-bas.
  ⚠️ Le sous-dossier facturation/ (outil de facturation) reste ici : ne pas le supprimer.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>TAC Vélo</title>
<!-- Redirection immédiate, même sans JavaScript -->
<meta http-equiv="refresh" content="0; url=https://tac-velo.fr/">
<!-- Dit à Google que la vraie adresse est tac-velo.fr -->
<link rel="canonical" href="https://tac-velo.fr/">
<script>
  // Les téléphones qui avaient « installé » l'ancienne page gardent un petit
  // programme (service worker) pour ce dossier : on le retire, il ne sert plus.
  // (Celui de facturation/ a sa propre portée et n'est pas touché.)
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => {
      if (new URL(r.scope).pathname === "/julien/") r.unregister();
    })).catch(() => {});
  }
  // On garde l'éventuelle ancre (#contact…) en changeant d'adresse
  location.replace("https://tac-velo.fr/" + location.hash);
</script>
</head>
<body>
<p><a href="https://tac-velo.fr/">TAC Vélo, le site de Julien, mécanicien vélo, est désormais sur tac-velo.fr.</a></p>
</body>
</html>
