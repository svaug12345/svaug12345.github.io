<!DOCTYPE html>
<!--
  ============================================================
  baiji.fr/code/ — « Code de la route » (charte SV)
  Version 1.3.0
  ------------------------------------------------------------
  Entraînement au code de la route pour Nanon (conduite
  accompagnée dès 15 ans) : examen blanc 40 questions / 20 s,
  entraînement par thème (10 thèmes officiels), « Mes erreurs »,
  statistiques, panneaux dessinés en SVG.
  Les questions sont dans src/q1.js … q4.js (projet de travail),
  insérées ici par build.py : chercher « Q(" » pour les modifier.
  Historique :
   • v1.0.0 : 246 questions, examen blanc, thèmes, erreurs, stats
   • v1.1.0 : 323 questions, 15 panneaux de plus
   • v1.1.1 : mise en ligne sur baiji.fr/code/ (police Manrope,
              teal de la charte, compteur de visites, PWA du site,
              mise en page tablette)
   • v1.2.0 : personnalisé pour Nanon (prénom, compte à rebours de ses
              15 ans, messages du coach « Vroum »), une illustration par
              question (scenes.js), gamification (XP, niveaux, série de
              jours, objectif du jour, combos, badges, confettis),
              ergonomie PC (clavier A-D / 1-4, Entrée, Échap ; mise en page
              2 colonnes, survols, focus visibles)
   • v1.2.1 : compte à rebours calé sur l'anniversaire de Nanon (8 juin 2027)
   • v1.3.0 : demi-examen blanc (20 questions, 2 par thème, 18/20 pour être
              reçue), coach plus taquin, date d'anniversaire retirée de
              l'écran et des réglages (le compteur vise toujours le 8 juin 2027)
  ============================================================
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code de la route</title>
<meta name="robots" content="noindex">
<!-- PWA : manifeste, icônes et sw.js fabriqués par outils/generer-pwa.py -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="icon" href="icones/icone-192.png">
<meta name="theme-color" content="#0f7c7b">
<!-- Police de la charte SV -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<!-- Compteur de visites de baiji.fr (voir /journal.js) -->
<script src="/journal.js" defer></script>
<style>
/* ============ Charte SV : teal #0f7c7b, neutres vert-bleu, Manrope ============ */
:root{
  --sv:#0f7c7b; --sv-dark:#0b3c49; --sv-light:#e3f4f4; --bg:#f4f8f8; --card:#fff;
  --txt:#14262b; --muted:#5d7277; --ok:#1f9d55; --ko:#d64545; --line:#d7e4e5;
  --gold:#f4b400; --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh}
button,input{font:inherit}
button{cursor:pointer;border:0}
/* Focus visible pour la navigation au clavier (PC) */
:focus-visible{outline:3px solid #7fd6d3;outline-offset:2px;border-radius:10px}
.app{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}

/* En-tête personnalisé */
.top{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.top .mascotte{width:56px;height:56px;flex:none}
.top h1{font-size:22px;margin:0;line-height:1.15}
.top small{color:var(--muted);font-size:13px}

/* Cartes */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(11,60,73,.08)}
.hero{background:linear-gradient(135deg,var(--sv-dark),var(--sv));color:#fff}
.hero h2{margin:0 0 4px;font-size:20px}
.hero p{margin:0 0 14px;opacity:.88;font-size:14px}
.btn{display:block;width:100%;padding:14px;border-radius:12px;font-weight:700;font-size:15px;background:var(--sv);color:#fff;text-align:center;text-transform:uppercase;letter-spacing:.06em;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.white{background:#fff;color:var(--sv-dark)}
.btn.demi{margin-top:8px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.45)}
.btn.demi small{text-transform:none;letter-spacing:0;font-weight:600;opacity:.85}
.btn.ghost{background:var(--sv-light);color:var(--sv-dark)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px}
.row>*{flex:1}
h3{font-size:14px;margin:20px 4px 10px;color:var(--sv-dark);text-transform:uppercase;letter-spacing:.06em}
.kbd{display:inline-block;min-width:20px;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;font-size:12px;font-weight:700;color:var(--muted);background:#fff;text-align:center}

/* Profil : niveau, XP, série, objectif du jour */
.profil{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.niveau-badge{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#ffd166,var(--gold));display:grid;place-items:center;font-size:30px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.niveau-nom{font-weight:800;font-size:17px}
.niveau-nom small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.xpbar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0 4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sv),#3fb8b5);border-radius:5px;transition:width .6s}
.xptxt{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700}
.chip.fire{background:#fff1e6;color:#c2410c}
.chip.goal{background:var(--sv-light);color:var(--sv-dark)}
.compte{margin-top:12px;padding:10px 12px;border-radius:12px;background:#fff8e6;font-size:14px;line-height:1.4}
.compte b{color:#b45309}

/* Liste des thèmes */
.theme{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);padding:12px 14px;border-radius:12px;margin-bottom:8px;text-align:left;box-shadow:0 1px 2px rgba(11,60,73,.06);color:var(--txt)}
.theme .ic{font-size:22px;width:30px;text-align:center}
.theme .name{flex:1;font-weight:700;font-size:15px}
.theme .name small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
.theme .star{font-size:16px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--sv);border-radius:3px}

/* Badges */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:11px;font-weight:600;color:var(--muted);background:none;padding:0}
.badge .rond{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--line);filter:grayscale(1);opacity:.45}
.badge.ok{color:var(--txt)}
.badge.ok .rond{background:linear-gradient(135deg,#fff3c4,#ffd166);filter:none;opacity:1;box-shadow:0 2px 6px rgba(244,180,0,.35)}

/* Statistiques */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--sv-dark)}
.stat span{font-size:12px;color:var(--muted)}

/* Écran de quiz */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.qhead .close{background:none;font-size:26px;color:var(--muted);padding:0 4px;line-height:1}
.qhead .prog{flex:1}
.qhead .count{font-size:13px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.combo{color:#c2410c;font-weight:800}
.timer{width:44px;height:44px;flex:none;position:relative}
.timer svg{transform:rotate(-90deg)}
.timer span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--sv-dark)}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--sv);background:var(--sv-light);padding:4px 10px;border-radius:20px;margin-bottom:10px}
.visuel{margin:0 0 12px}
.visuel .sign{width:130px;height:130px;margin:6px auto 0}
.visuel .scene svg{display:block;width:100%;height:auto;max-height:180px;border-radius:14px}
.question{font-size:18px;font-weight:700;line-height:1.35;margin:0 0 6px}
.hint{font-size:12px;color:var(--muted);margin-bottom:14px}
.answer{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;font-size:16px;color:var(--txt);line-height:1.3;transition:border-color .12s,background .12s}
.answer .letter{flex:none;width:28px;height:28px;border-radius:8px;background:var(--sv-light);color:var(--sv-dark);display:grid;place-items:center;font-weight:800}
.answer.sel{border-color:var(--sv);background:#f0fafa}
.answer.sel .letter{background:var(--sv);color:#fff}
.answer.good{border-color:var(--ok);background:#edf9f1}
.answer.good .letter{background:var(--ok);color:#fff}
.answer.bad{border-color:var(--ko);background:#fdeeee}
.answer.bad .letter{background:var(--ko);color:#fff}
.answer:disabled{cursor:default}
.explain{display:flex;gap:12px;align-items:flex-start;border-left:4px solid var(--sv);background:#fff;border-radius:10px;padding:12px 14px;margin:6px 0 14px;font-size:15px;line-height:1.45}
.explain .mascotte{width:52px;height:52px;flex:none}
.explain b{display:block;margin-bottom:4px}
.explain.ok{border-color:var(--ok)} .explain.ok b{color:var(--ok)}
.explain.ko{border-color:var(--ko)} .explain.ko b{color:var(--ko)}
.sticky{position:sticky;bottom:12px}
.clavier{display:none;font-size:12px;color:var(--muted);text-align:center;margin-top:10px}

/* Résultats */
.score{text-align:center;padding:22px 16px}
.score .mascotte{width:90px;height:90px;margin:0 auto 6px}
.score .big{font-size:56px;font-weight:800;color:var(--sv-dark);line-height:1}
.score .big small{font-size:24px;color:var(--muted)}
.verdict{font-size:20px;font-weight:800;margin:10px 0 4px}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--ko)}
.gain{display:inline-block;margin-top:10px;padding:6px 14px;border-radius:20px;background:#fff3c4;color:#8a5a00;font-weight:800}
.recap{font-size:14px;border-top:1px solid var(--line);padding:12px 0}
.recap .q{font-weight:700;margin-bottom:4px}
.recap .r{color:var(--muted)}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:800;margin-right:6px;color:#fff}
.pill.ok{background:var(--ok)} .pill.ko{background:var(--ko)}

/* Réglages */
.reglage{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px;padding:8px 0}
.reglage input[type=checkbox]{width:22px;height:22px;accent-color:var(--sv)}
.reglage input[type=text],.reglage input[type=date]{border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:170px;background:#fff;color:var(--txt)}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}
.link{background:none;color:var(--sv);font-weight:700;padding:8px 0}

/* Notifications (« +10 XP », nouveau badge, niveau) */
.toasts{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:20;pointer-events:none;width:min(92vw,420px)}
.toast{background:var(--sv-dark);color:#fff;border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18);display:flex;gap:10px;align-items:center;animation:toast 2.4s forwards}
.toast .e{font-size:24px}
@keyframes toast{0%{opacity:0;transform:translateY(12px)}8%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}
.xpfloat{position:fixed;font-weight:800;color:var(--gold);font-size:20px;pointer-events:none;z-index:15;animation:monte 1.1s forwards;text-shadow:0 1px 0 #fff}
@keyframes monte{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-50px)}}
canvas#confettis{position:fixed;inset:0;pointer-events:none;z-index:30}

/* ============ PC : souris et clavier ============
   Survols uniquement avec une vraie souris (pas sur écran tactile). */
@media (hover:hover) and (pointer:fine){
  .btn:not(:disabled):hover{filter:brightness(1.08)}
  .theme:hover{box-shadow:0 4px 14px rgba(11,60,73,.12);transform:translateY(-1px)}
  .answer:not(:disabled):hover{border-color:#8fcac9}
  .clavier{display:block}
  .theme{transition:box-shadow .15s,transform .15s}
}

/* ============ TABLETTE (à partir de 760 px de large) ============
   Le téléphone ne change pas. Sur tablette : page plus large,
   thèmes et badges en colonnes, questions un peu plus grandes. */
@media (min-width:760px){
  .app{max-width:1180px;padding-left:32px;padding-right:32px}
  .accueil{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .accueil .plein{grid-column:1 / -1}
  .accueil .card{margin-bottom:0}
  .themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .themes .theme{margin:0}
  .badges{grid-template-columns:repeat(8,1fr)}
  .quiz{max-width:760px;margin:0 auto}
  .question{font-size:21px}
  .visuel .sign{width:160px;height:160px}
  .visuel .scene svg{max-height:220px}
}
@media (min-width:1100px){
  .themes{grid-template-columns:1fr 1fr 1fr}
  /* Grand écran (PC) : l'illustration à gauche, la question à droite */
  .quiz{max-width:1120px}
  .qcorps{display:grid;grid-template-columns:420px 1fr;gap:28px;align-items:start}
  .qcorps .visuel{position:sticky;top:20px}
  .visuel .scene svg{max-height:none}
  .visuel .sign{width:220px;height:220px;margin-top:20px}
  .sticky{position:static}
  .qcorps .visuel{background:#fff;border-radius:18px;padding:14px;box-shadow:0 1px 3px rgba(11,60,73,.08)}
  .visuel .sign{margin:16px auto}
  .toasts{left:auto;right:24px;bottom:24px;transform:none;width:360px}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toasts" id="toasts"></div>

<script>
/* ===================================================================
   Code de la route — appli d'entraînement (charte SV)
   Version affichée dans le pied de page : pensez à l'incrémenter.
   =================================================================== */
const VERSION = "1.3.0";

/* ---------- 1. Chargement de la banque de questions ----------
   Les fichiers de questions appellent Q(...) : on remplit le tableau QUESTIONS. */
const QUESTIONS = [];
function Q(theme, text, answers, good, explain, sign){
  QUESTIONS.push({theme, text, answers, good, explain, sign});
}
</script>
<script>
// ============================================================
//  Panneaux et pictogrammes dessinés en SVG
//  Chaque fonction renvoie le code SVG (carré 120×120) d'un panneau.
//  Avantage : aucune image à télécharger, rendu net sur tous les écrans.
// ============================================================
const SIGNS = (() => {
  // Couleurs officielles approximatives de la signalisation
  const R = "#d0021b", B = "#0a4fa6", Y = "#f5c400", K = "#1a1a1a", W = "#ffffff";
  // Enveloppe SVG commune
  const svg = (inner) => `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img">${inner}</svg>`;
  // Triangle de danger (pointe en haut) avec un contenu au centre
  const danger = (inner) => svg(`<path d="M60 8 L114 104 H6 Z" fill="${W}" stroke="${R}" stroke-width="10" stroke-linejoin="round"/>${inner}`);
  // Panneau rond à bord rouge (interdiction / limitation)
  const rond = (inner, fond = W) => svg(`<circle cx="60" cy="60" r="52" fill="${fond}" stroke="${R}" stroke-width="12"/>${inner}`);
  // Panneau de limitation de vitesse
  const limite = (n) => rond(`<text x="60" y="76" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="${n >= 100 ? 40 : 50}" text-anchor="middle" fill="${K}">${n}</text>`);
  // Petite silhouette de voiture vue de dos (pour l'interdiction de dépasser)
  const voiture = (x, c) => `<rect x="${x}" y="50" width="22" height="22" rx="5" fill="${c}"/><rect x="${x + 3}" y="44" width="16" height="10" rx="3" fill="${c}"/>`;

  return {
    stop: svg(`<path d="M38 6 H82 L114 38 V82 L82 114 H38 L6 82 V38 Z" fill="${R}" stroke="${W}" stroke-width="4"/>
      <text x="60" y="73" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="34" text-anchor="middle" fill="${W}">STOP</text>`),
    cedez: svg(`<path d="M6 14 H114 L60 108 Z" fill="${W}" stroke="${R}" stroke-width="10" stroke-linejoin="round"/>`),
    prio_droite: danger(`<path d="M44 52 L76 86 M76 52 L44 86" stroke="${K}" stroke-width="8"/>`),
    intersection_prio: danger(`<path d="M60 40 V94" stroke="${K}" stroke-width="12"/><path d="M42 68 H78" stroke="${K}" stroke-width="5"/>`),
    route_prio: svg(`<rect x="22" y="22" width="76" height="76" transform="rotate(45 60 60)" fill="${W}" stroke="${K}" stroke-width="2"/>
      <rect x="32" y="32" width="56" height="56" transform="rotate(45 60 60)" fill="${Y}"/>`),
    fin_route_prio: svg(`<rect x="22" y="22" width="76" height="76" transform="rotate(45 60 60)" fill="${W}" stroke="${K}" stroke-width="2"/>
      <rect x="32" y="32" width="56" height="56" transform="rotate(45 60 60)" fill="${Y}"/>
      <path d="M30 90 L90 30" stroke="${K}" stroke-width="9"/>`),
    sens_interdit: svg(`<circle cx="60" cy="60" r="54" fill="${R}"/><rect x="24" y="51" width="72" height="18" fill="${W}"/>`),
    interdit_circulation: rond(""),
    interdit_depasser: rond(`${voiture(31, R)}${voiture(66, K)}`),
    stationnement_interdit: rond(`<path d="M24 24 L96 96" stroke="${R}" stroke-width="10"/>`, B),
    arret_interdit: rond(`<path d="M24 24 L96 96 M96 24 L24 96" stroke="${R}" stroke-width="10"/>`, B),
    obligation_droite: svg(`<circle cx="60" cy="60" r="54" fill="${B}"/>
      <path d="M30 60 H80" stroke="${W}" stroke-width="12"/><path d="M70 40 L94 60 L70 80 Z" fill="${W}"/>`),
    sens_unique: svg(`<rect x="10" y="10" width="100" height="100" rx="8" fill="${B}"/>
      <path d="M60 94 V44" stroke="${W}" stroke-width="14"/><path d="M38 50 L60 22 L82 50 Z" fill="${W}"/>`),
    giratoire: danger(`<g fill="none" stroke="${K}" stroke-width="5">
      <path d="M48 74 A14 14 0 0 1 60 56"/><path d="M68 60 A14 14 0 0 1 70 80"/><path d="M60 88 A14 14 0 0 1 46 82"/></g>
      <path d="M58 50 L66 57 L56 61 Z M75 82 L66 84 L70 75 Z M42 86 L42 76 L50 82 Z" fill="${K}"/>`),
    danger: danger(`<rect x="55" y="42" width="10" height="34" rx="3" fill="${K}"/><circle cx="60" cy="87" r="6" fill="${K}"/>`),
    virage_droite: danger(`<path d="M52 94 V72 Q52 56 68 52" fill="none" stroke="${K}" stroke-width="8"/><path d="M64 42 L80 52 L64 62 Z" fill="${K}"/>`),
    limit30: limite(30), limit50: limite(50), limit80: limite(80), limit90: limite(90), limit110: limite(110), limit130: limite(130),
    pietons: svg(`<rect x="10" y="10" width="100" height="100" rx="8" fill="${B}"/><path d="M60 20 L102 96 H18 Z" fill="${W}"/>
      <circle cx="62" cy="46" r="6" fill="${K}"/><path d="M60 54 L54 72 L46 88 M54 72 L66 88 M58 60 L48 68 M60 58 L72 66" stroke="${K}" stroke-width="5" stroke-linecap="round" fill="none"/>`),
    // Panonceau « cédez-le-passage cycliste au feu » : triangle pointe en bas, vélo et flèche
    m12: svg(`<path d="M6 14 H114 L60 108 Z" fill="${W}" stroke="${R}" stroke-width="8" stroke-linejoin="round"/>
      <g fill="none" stroke="${K}" stroke-width="3"><circle cx="46" cy="50" r="10"/><circle cx="74" cy="50" r="10"/>
      <path d="M46 50 L56 34 H70 L74 50 M56 34 L62 50 L70 34"/></g>
      <path d="M50 70 H68" stroke="${K}" stroke-width="5"/><path d="M64 63 L74 70 L64 77 Z" fill="${K}"/>`),
    // Pictogrammes des médicaments (niveaux 1 et 3)
    medoc1: svg(`<path d="M60 10 L112 100 H8 Z" fill="${Y}" stroke="${K}" stroke-width="4" stroke-linejoin="round"/>
      <text x="60" y="58" font-family="Arial" font-weight="bold" font-size="20" text-anchor="middle" fill="${K}">1</text>
      <circle cx="60" cy="80" r="12" fill="none" stroke="${K}" stroke-width="4"/><path d="M60 68 V92 M48 80 H72" stroke="${K}" stroke-width="3"/>`),
    medoc3: svg(`<path d="M60 10 L112 100 H8 Z" fill="${R}" stroke="${K}" stroke-width="4" stroke-linejoin="round"/>
      <text x="60" y="58" font-family="Arial" font-weight="bold" font-size="20" text-anchor="middle" fill="${W}">3</text>
      <circle cx="60" cy="80" r="12" fill="none" stroke="${W}" stroke-width="4"/><path d="M60 68 V92 M48 80 H72" stroke="${W}" stroke-width="3"/>`),
    // Témoins du tableau de bord
    temoin_route: svg(`<rect x="8" y="20" width="104" height="80" rx="14" fill="${K}"/>
      <path d="M58 38 Q30 38 30 60 Q30 82 58 82 Z" fill="none" stroke="#2f7bff" stroke-width="6"/>

// Scène par défaut de chaque thème
const SCENE_THEME = { L:"carrefour", C:"vitesse", R:"virage", U:"pieton", D:"papiers", P:"secours", A:"stationnement", M:"moteur", S:"ceinture", E:"eco" };

function sceneDe(q){
  const texte = q.text + " " + q.answers.join(" ");
  for (const [re, cle] of SCENE_REGLES) if (re.test(texte)) return cle;
  return SCENE_THEME[q.theme] || "jour";
}

// ---------- Panneaux et priorités ----------
Q("L","Que m'impose ce panneau ?",["De marquer un arrêt absolu à la limite de la chaussée abordée","De ralentir et de passer si personne n'arrive","De céder le passage uniquement aux véhicules venant de droite"],[0],"Le STOP impose un arrêt complet (roues immobiles) à la ligne d'effet, puis de céder le passage à tous les usagers de la route abordée, à droite comme à gauche.","stop");

Q("L","Ce panneau m'indique :",["Que je suis prioritaire à la prochaine intersection seulement","Que je dois céder le passage à droite","Que la route qui croise doit me céder le passage"],[0,2],"Triangle avec une croix « gros trait vertical » : intersection avec une route non prioritaire. Je suis prioritaire uniquement à cette intersection.","intersection_prio");
Q("L","Ce panneau signifie :",["Je circule sur une route à caractère prioritaire","Je dois céder le passage à droite à chaque intersection","Je suis prioritaire jusqu'au panneau de fin"],[0,2],"Le losange jaune indique une route à caractère prioritaire : je suis prioritaire à toutes les intersections jusqu'au panneau de fin de caractère prioritaire.","route_prio");

Q("L","Ce panneau m'interdit :",["L'accès à cette voie (sens interdit)","Le stationnement","Le dépassement"],[0],"Rond rouge avec une barre blanche horizontale : sens interdit à tout véhicule.","sens_interdit");
Q("L","Ce panneau interdit :",["La circulation à tous les véhicules dans les deux sens","Uniquement le stationnement","Uniquement les camions"],[0],"Rond blanc à bordure rouge sans symbole : circulation interdite à tout véhicule dans les deux sens.","interdit_circulation");
Q("L","Ce panneau m'interdit :",["De dépasser tous les véhicules à moteur autres que les deux-roues","De dépasser les cyclistes","De circuler à plus de 50 km/h"],[0],"Interdiction de dépasser les véhicules à moteur autres que les deux-roues sans side-car. Dépasser un cycliste reste possible si c'est sans danger.","interdit_depasser");
Q("L","Ce panneau interdit :",["Le stationnement","L'arrêt","La circulation"],[0],"Rond bleu bordé de rouge avec une seule barre : stationnement interdit. L'arrêt (rapide, conducteur à proximité) reste autorisé.","stationnement_interdit");
Q("L","Ce panneau interdit :",["Le stationnement","L'arrêt","La circulation des vélos"],[0,1],"Rond bleu avec une croix rouge : arrêt ET stationnement interdits.","arret_interdit");
Q("L","Ce panneau signifie :",["Obligation de tourner à droite","Direction conseillée","Interdiction de tourner à droite"],[0],"Un panneau rond bleu est un panneau d'obligation : ici, direction obligatoire à droite.","obligation_droite");
Q("L","Ce panneau m'indique :",["Une voie à sens unique","Une obligation d'aller tout droit","Une autoroute"],[0],"Panneau carré bleu avec flèche blanche : panneau d'indication de sens unique.","sens_unique");
Q("L","Ce panneau m'annonce :",["Un carrefour à sens giratoire","Un rond-point où je serai prioritaire","Une zone de travaux"],[0],"Panneau de danger annonçant un carrefour à sens giratoire. En général, je devrai céder le passage aux véhicules déjà engagés sur l'anneau.","giratoire");
Q("L","Ce panneau m'annonce :",["Un danger dont la nature n'est pas précisée","Une interdiction","Une fin d'interdiction"],[0],"Triangle avec un point d'exclamation : « autres dangers ». Un panonceau précise souvent la nature du danger.","danger");
Q("L","Ce panneau m'annonce :",["Un virage à droite","Une obligation de tourner à droite","Un virage à gauche"],[0],"Triangle avec flèche courbée vers la droite : virage dangereux à droite. J'adapte ma vitesse avant le virage.","virage_droite");
Q("L","Ce panneau m'indique :",["Une vitesse maximale de 30 km/h","Une vitesse conseillée de 30 km/h","Une vitesse minimale de 30 km/h"],[0],"Rond blanc bordé de rouge avec un chiffre : vitesse maximale autorisée.","limit30");

Q("L","Au sol, une ligne en zigzag jaune indique :",["Un emplacement d'arrêt de bus où arrêt et stationnement sont interdits","Une piste cyclable","Une place de livraison"],[0],"Le zigzag jaune signale l'emplacement réservé à l'arrêt des bus.");

Q("P","Face à un accident, l'ordre des actions est :",["Protéger, Alerter, Secourir","Secourir, Alerter, Protéger","Alerter, Secourir, Protéger"],[0],"P.A.S. : on protège d'abord pour éviter un sur-accident, puis on alerte, puis on secourt.");

Q("M","Une roue de secours « galette » :",["Est temporaire","Impose une vitesse limitée (souvent 80 km/h)","Peut rester montée pendant des mois"],[0,1],"La roue galette dépanne pour quelques kilomètres, à vitesse réduite.");
Q("M","Des balais d'essuie-glace qui laissent des traces :",["Doivent être changés","Réduisent la visibilité par temps de pluie","Sont sans danger"],[0,1],"Une bonne visibilité est essentielle : on change les balais environ une fois par an.");

// ---------- S : ÉQUIPEMENTS DE SÉCURITÉ ----------
Q("S","Le gilet de haute visibilité doit être :",["Accessible depuis le poste de conduite","Rangé dans le coffre sous les bagages","Facultatif"],[0],"Il doit être à portée de main pour l'enfiler avant de sortir du véhicule.");
Q("S","Le triangle de présignalisation se place :",["À au moins 30 mètres du véhicule","Juste derrière le pare-chocs","À 5 mètres"],[0],"À 30 m au moins, en amont, de manière visible. Sur autoroute, on ne le pose pas si c'est dangereux de le faire.");

Q("S","La ceinture de sécurité doit être portée :",["Bien serrée, passant sur l'épaule et le bassin","Sous le bras","Lâche pour plus de confort"],[0],"Sangle sur l'épaule (pas sur le cou) et sur le bassin (pas sur le ventre), sans jeu.");

Q("S","Un limiteur de vitesse :",["M'empêche de dépasser la vitesse que j'ai choisie","Maintient la voiture à une vitesse constante sans accélérer","Freine à ma place"],[0],"Le limiteur fixe un plafond. Le régulateur, lui, maintient une vitesse constante sans que j'appuie sur l'accélérateur.");

Q("S","Les aides à la conduite (freinage d'urgence automatique, alerte de franchissement de ligne…) :",["Ne dispensent jamais d'être attentif","Permettent de téléphoner tranquillement","Conduisent à ma place"],[0],"Ce sont des aides : le conducteur reste responsable et attentif.");

Q("S","Un enfant de moins de 12 ans à vélo doit porter :",["Un casque attaché","Un gilet uniquement","Rien d'obligatoire"],[0],"Le casque est obligatoire pour les moins de 12 ans à vélo, conducteurs ou passagers.");

// ---------- E : ENVIRONNEMENT ----------
Q("E","Pour consommer moins, je :",["Passe les rapports assez tôt","Anticipe pour éviter les freinages brusques","Fais chauffer le moteur à l'arrêt avant de partir"],[0,1],"Éco-conduite : souplesse, anticipation, rapports passés tôt. On part sans attendre : le moteur chauffe plus vite en roulant doucement.");

Q("E","Lors d'un pic de pollution, les vitesses maximales peuvent être :",["Abaissées de 20 km/h","Augmentées","Inchangées obligatoirement"],[0],"En cas de pic de pollution, la préfecture peut abaisser les vitesses de 20 km/h.");

Q("E","Sur une voiture électrique, le freinage régénératif :",["Recharge un peu la batterie en ralentissant","Vide la batterie","N'existe pas"],[0],"En décélérant, le moteur électrique fonctionne en générateur et récupère de l'énergie.");
Q("E","Par grand froid, l'autonomie d'une voiture électrique :",["Diminue","Augmente","Ne change pas"],[0],"Le froid réduit les performances de la batterie et le chauffage consomme de l'énergie.");

Q("E","Une conduite souple et anticipée permet :",["De consommer moins","De réduire l'usure des freins et des pneus","De réduire le risque d'accident"],[0,1,2],"L'éco-conduite est aussi une conduite plus sûre.");

<script>
/* ---------- 2. Thèmes officiels de l'examen (10 thèmes) ---------- */
const THEMES = {
  L:{name:"Circulation routière",  sub:"Panneaux, priorités, vitesses", ic:"🚦"},
  C:{name:"Le conducteur",         sub:"Alcool, fatigue, distances, points", ic:"🧑"},
  R:{name:"La route",              sub:"Météo, nuit, montagne, virages", ic:"🛣️"},
  U:{name:"Les autres usagers",    sub:"Piétons, cyclistes, poids lourds", ic:"🚲"},
  D:{name:"Réglementation & divers", sub:"Papiers, stationnement, permis", ic:"📄"},

};

/* Identifiant stable pour chaque question (petit hash du texte),
   pour que les statistiques survivent à l'ajout de nouvelles questions. */
function hash(s){ let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return (h >>> 0).toString(36); }
// (le panneau et la 1re réponse sont inclus : plusieurs questions « Ce panneau… » ont le même texte)
QUESTIONS.forEach(q => q.id = hash(q.theme + q.text + (q.sign || "") + q.answers[0]));

/* ---------- 3. Sauvegarde locale (progression) ----------
   localStorage peut être indisponible : on protège tout par try/catch.
   v1.2.0 : nouveaux champs (xp, jours, badges, combo record, prénom, anniversaire),
   ajoutés sans rien perdre de la progression des versions précédentes. */
const KEY = "sv-code-v1";
let DATA = { seen:{}, errors:[], exams:[], chrono:true,
             xp:0, days:{}, badges:{}, bestCombo:0, prenom:"Nanon", demis:[] };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) DATA = Object.assign(DATA, s); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(DATA)); } catch(e) {} }

/* ---------- 4. Outils ---------- */
const $app = document.getElementById("app");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nom = () => esc(DATA.prenom || "toi");
// Date du jour au format AAAA-MM-JJ, à l'heure locale (toISOString donnerait l'heure UTC)
const jourCle = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

/* ---------- 5. « Vroum », la mascotte-coach ----------
   Une petite voiture teal avec 3 humeurs : content, oups, fête. */
function mascotte(humeur = "content"){
  const bouche = humeur === "oups" ? `<path d="M50 70 q10 -8 20 0" stroke="#14262b" stroke-width="3" fill="none" stroke-linecap="round"/>`
               : `<path d="M48 64 q12 12 24 0" stroke="#14262b" stroke-width="3" fill="${humeur === "fete" ? "#e63946" : "none"}" stroke-linecap="round"/>`;
  const yeux = humeur === "fete" ? `<path d="M42 52 q6 -6 12 0 M66 52 q6 -6 12 0" stroke="#14262b" stroke-width="3" fill="none" stroke-linecap="round"/>`
             : `<circle cx="48" cy="52" r="5" fill="#14262b"/><circle cx="72" cy="52" r="5" fill="#14262b"/><circle cx="50" cy="50" r="1.6" fill="#fff"/><circle cx="74" cy="50" r="1.6" fill="#fff"/>`;
  const extra = humeur === "fete" ? `<path d="M14 22 l6 6 M106 22 l-6 6 M60 4 v8" stroke="#f4b400" stroke-width="4" stroke-linecap="round"/>`
              : humeur === "oups" ? `<path d="M96 30 q4 8 0 10 q-4 -2 0 -10z" fill="#5fa8d3"/>` : "";
  return `<svg class="mascotte" viewBox="0 0 120 110" aria-hidden="true">${extra}
    <path d="M14 78 Q12 58 30 54 L40 30 Q44 22 54 22 H70 Q80 22 84 30 L92 54 Q110 58 108 78 V86 H14 Z" fill="#0f7c7b"/>
    <path d="M44 34 Q46 28 54 28 H68 Q76 28 78 34 L82 46 H40 Z" fill="#dff4f6"/>
    <circle cx="34" cy="88" r="11" fill="#14262b"/><circle cx="88" cy="88" r="11" fill="#14262b"/>
    <circle cx="34" cy="88" r="4" fill="#c9d3d6"/><circle cx="88" cy="88" r="4" fill="#c9d3d6"/>
    <rect x="24" y="44" width="72" height="34" rx="14" fill="#16a3a1" opacity=".55"/>${yeux}${bouche}</svg>`;
}
// Messages du coach, tirés au hasard (le prénom est personnalisable dans les réglages)
// Ton taquin mais toujours gentil : on se moque un peu, jamais méchamment
const BRAVO = ["Bien joué {n} !", "Tu gères {n} !", "Imparable 😎", "Pas mal… pour une future conductrice 😏",
               "Ok, celle-là était facile 😜", "Tu as triché ? Non ? Respect.", "Papa est impressionné (il ne l'avouera jamais)",
               "Attention, ça va finir par se voir que tu révises", "Nickel, {n} ! Même Vroum est jaloux"];
const OUPS  = ["Aïe… heureusement que tu n'as pas encore le volant 😬", "Le panneau était pourtant énorme 🙈",
               "On dira que c'était un test pour voir si je suivais", "Bip bip, erreur détectée 🤖", "Même la poule hésitait sur celle-là 🐔",
               "Presque, {n} ! (non, pas vraiment 😅)", "Pas grave, tu ne recommenceras plus, hein ?", "Celle-là est piégeuse… mais quand même 😏"];
const msg = liste => pick(liste).replace("{n}", nom());

/* ---------- 6. Gamification : XP, niveaux, série de jours, badges ---------- */
// Niveaux : nom sur le thème de la route, XP nécessaire pour l'atteindre
const NIVEAUX = [
  { xp:0,    nom:"Piétonne",               e:"🚶‍♀️" },
  { xp:100,  nom:"Cycliste",               e:"🚲" },
  { xp:250,  nom:"Passagère avant",        e:"💺" },
  { xp:500,  nom:"Apprentie",              e:"🔰" },
  { xp:900,  nom:"Conductrice accompagnée", e:"🚗" },
  { xp:1400, nom:"Reine du créneau",       e:"👑" },
  { xp:2000, nom:"As du code",             e:"🎯" },
  { xp:3000, nom:"Pilote",                 e:"🏎️" },
  { xp:4500, nom:"Légende de la route",    e:"🏆" }
];
function niveau(xp = DATA.xp){
  let i = 0; while (i + 1 < NIVEAUX.length && xp >= NIVEAUX[i + 1].xp) i++;
  const cur = NIVEAUX[i], suiv = NIVEAUX[i + 1];
  return { i, cur, suiv, pct: suiv ? Math.round(100 * (xp - cur.xp) / (suiv.xp - cur.xp)) : 100 };
}
const OBJECTIF_JOUR = 20;                      // questions par jour
const aujourdhui = () => DATA.days[jourCle()] || 0;
// Série : nombre de jours d'affilée (jusqu'à aujourd'hui, ou hier si rien encore aujourd'hui) avec au moins 10 réponses
function serieJours(){
  let n = 0; const d = new Date();
  if ((DATA.days[jourCle(d)] || 0) < 10) d.setDate(d.getDate() - 1);
  while ((DATA.days[jourCle(d)] || 0) >= 10) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const totalBons = () => Object.values(DATA.seen).reduce((s, v) => s + v.ok, 0);
const questionsPanneaux = QUESTIONS.filter(q => q.sign && !q.sign.startsWith("temoin") && !q.sign.startsWith("medoc"));

// Badges : chacun a un test ; ctx = infos de la série en cours (combo, score d'examen…)
const BADGES = [
  { id:"premier",   e:"🚦", nom:"Premier pas",     desc:"Répondre à une première question", test: () => totalBons() + Object.values(DATA.seen).reduce((s, v) => s + v.ko, 0) >= 1 },
  { id:"combo10",   e:"🔥", nom:"En feu",          desc:"10 bonnes réponses d'affilée",     test: () => DATA.bestCombo >= 10 },
  { id:"combo25",   e:"☄️", nom:"Inarrêtable",     desc:"25 bonnes réponses d'affilée",     test: () => DATA.bestCombo >= 25 },
  { id:"exam1",     e:"📝", nom:"Baptême",         desc:"Terminer un premier examen blanc", test: () => DATA.exams.length >= 1 },
  { id:"recue",     e:"🎓", nom:"Reçue !",         desc:"35/40 ou plus à un examen blanc",  test: () => DATA.exams.some(e => e.score >= 35) },
  { id:"parfait",   e:"💎", nom:"Sans faute",      desc:"40/40 à un examen blanc",          test: () => DATA.exams.some(e => e.score === 40) },
  { id:"demi",      e:"🌗", nom:"Mi-temps",        desc:"18/20 ou plus à un demi-examen",   test: () => (DATA.demis || []).some(e => e.score >= 18) },
  { id:"recue5",    e:"🏅", nom:"Régulière",       desc:"Reçue à 5 examens blancs",         test: () => DATA.exams.filter(e => e.score >= 35).length >= 5 },
  { id:"jour",      e:"☀️", nom:"Objectif du jour", desc:`${OBJECTIF_JOUR} questions dans la journée`, test: () => aujourdhui() >= OBJECTIF_JOUR },
  { id:"serie3",    e:"📅", nom:"3 jours de suite", desc:"Réviser 3 jours d'affilée",       test: () => serieJours() >= 3 },
  { id:"serie7",    e:"🗓️", nom:"Semaine parfaite", desc:"Réviser 7 jours d'affilée",       test: () => serieJours() >= 7 },
  { id:"cent",      e:"💯", nom:"Centurion",       desc:"100 bonnes réponses au total",     test: () => totalBons() >= 100 },
  { id:"cinqcents", e:"🚀", nom:"Machine",         desc:"500 bonnes réponses au total",     test: () => totalBons() >= 500 },
  { id:"panneaux",  e:"🛑", nom:"Reine des panneaux", desc:"Réussir toutes les questions de panneaux", test: () => questionsPanneaux.every(q => DATA.seen[q.id] && DATA.seen[q.id].ok) },
  { id:"secours",   e:"⛑️", nom:"Secouriste",      desc:"Maîtriser tout le thème Premiers secours", test: () => mastery("P").pct === 100 },
  { id:"tous",      e:"🌍", nom:"Tout-terrain",    desc:"Au moins 50 % dans chaque thème",  test: () => Object.keys(THEMES).every(k => mastery(k).pct >= 50) },
  { id:"table",     e:"🧹", nom:"Table rase",      desc:"Vider « Mes erreurs » après en avoir eu 10", test: () => DATA.erreursMax >= 10 && DATA.errors.length === 0 }
];

/* Ajoute des XP, détecte un passage de niveau et les nouveaux badges */
function gagnerXP(n, x, y){
  const avant = niveau().i;
  DATA.xp += n;
  if (x != null) flotter(`+${n} XP`, x, y);
  const apres = niveau();
  if (apres.i > avant) { toast(apres.cur.e, `Niveau ${apres.i + 1} : ${apres.cur.nom} !`); confettis(); }
}
function verifierBadges(){
  BADGES.forEach(b => {
    if (!DATA.badges[b.id] && b.test()) { DATA.badges[b.id] = Date.now(); toast(b.e, `Badge débloqué : ${b.nom}`); }
  });
}

/* Notifications et effets */
// Les notifications passent une par une (file d'attente) pour ne pas couvrir l'écran
const fileToasts = []; let toastEnCours = false;
function toast(e, texte){ fileToasts.push([e, texte]); if (!toastEnCours) toastSuivant(); }
function toastSuivant(){
  const n = fileToasts.shift();
  if (!n) { toastEnCours = false; return; }
  toastEnCours = true;
  const t = document.createElement("div");
  t.className = "toast"; t.innerHTML = `<span class="e">${n[0]}</span><span>${esc(n[1])}</span>`;
  document.getElementById("toasts").appendChild(t);
  setTimeout(() => { t.remove(); toastSuivant(); }, 2400);
}
function flotter(texte, x, y){
  const f = document.createElement("div");
  f.className = "xpfloat"; f.textContent = texte;
  f.style.left = (x - 30) + "px"; f.style.top = (y - 20) + "px";
  document.body.appendChild(f); setTimeout(() => f.remove(), 1100);
}
// Confettis : petites particules colorées qui tombent pendant ~2,5 s
function confettis(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas"); c.id = "confettis";
  c.width = innerWidth; c.height = innerHeight; document.body.appendChild(c);
  const g = c.getContext("2d"), cols = ["#0f7c7b", "#3fb8b5", "#f4b400", "#e63946", "#8338ec", "#52b788"];
  const ps = Array.from({length: 140}, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .4,
    vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3, r: 4 + Math.random() * 5, a: Math.random() * 6, c: pick(cols) }));
  const t0 = performance.now();
  (function anime(t){
    g.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += .1; g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); g.restore(); });
    if (t - t0 < 2600) requestAnimationFrame(anime); else c.remove();
  })(t0);
}

/* Taux de maîtrise d'un thème : questions déjà réussies au moins une fois / total */
function mastery(theme){
  const qs = QUESTIONS.filter(q => q.theme === theme);
  const ok = qs.filter(q => DATA.seen[q.id] && DATA.seen[q.id].ok > 0).length;
  return { ok, total: qs.length, pct: Math.round(100 * ok / qs.length) };
}

/* Compte à rebours jusqu'aux 15 ans (âge minimum de la conduite accompagnée) :
   les 15 ans de Nanon, le 8 juin 2027 (la date n'est pas affichée). */
function compteARebours(){
  let cible = new Date(2027, 5, 8); // mois 5 = juin (janvier = 0)
  const jours = Math.ceil((cible - new Date()) / 86400000);
  if (jours <= 0) return `🎉 <b>Tu as 15 ans</b> : tu peux commencer la conduite accompagnée, ${nom()} ! Ton entraînement va payer.`;
  return `🚗 <b>J-${jours}</b> avant tes 15 ans et le début de la conduite accompagnée. ${jours > 100 ? "Largement le temps… mais pas de quoi traîner 😏" : "Ça approche, accroche ta ceinture !"}`;
}

/* ---------- 7. Écran d'accueil ---------- */
function home(){
  stopTimer(); S = null;
  const exams = DATA.exams;
  const best = exams.length ? Math.max(...exams.map(e => e.score)) : "–";
  const last = exams.slice(-5);
  const avg = last.length ? (last.reduce((s, e) => s + e.score, 0) / last.length).toFixed(1) : "–";
  const nv = niveau(), serie = serieJours(), jour = aujourdhui();
  const h = new Date().getHours();
  const salut = h < 6 ? "Encore debout" : h < 12 ? "Bonjour" : h < 18 ? "Salut" : "Bonsoir";
  // Accroches taquines ; si elle n'est pas venue depuis plus de 2 jours, Vroum le remarque
  const derniere = Object.keys(DATA.days).sort().pop();
  const absente = derniere && (new Date() - new Date(derniere + "T00:00")) / 86400000 > 2;
  const accroches = absente ? ["Tiens, une revenante ! 👀", "Je commençais à croire que tu m'avais oublié…", "Le code ne s'est pas appris tout seul pendant ton absence 😏"]
    : h < 6 || h >= 23 ? ["Le code, c'est mieux réveillée 😴", "Tu ne dors jamais ?", "Une petite série et au lit !"]
    : ["Alors, on fait chauffer les neurones ?", "Le code ne va pas s'apprendre tout seul 😏", "Encore toi ? J'adore.",
       "Promis, aucune question sur la poule.", "Le volant t'attend 🚗", "Prête à épater Papa ?", "Objectif : 35/40, pas 34 😜"];

  const themes = Object.keys(THEMES).map(k => {
    const m = mastery(k), t = THEMES[k];
    return `<button class="theme" onclick="start('theme','${k}')">
      <span class="ic">${t.ic}</span>
      <span class="name">${t.name}<small>${t.sub} · ${m.ok}/${m.total}</small><span class="bar"><i style="width:${m.pct}%"></i></span></span>
      <span class="star">${m.pct === 100 ? "⭐" : "›"}</span></button>`;
  }).join("");
  const badges = BADGES.map(b => `<button class="badge ${DATA.badges[b.id] ? "ok" : ""}" onclick="toast('${b.e}', '${b.nom.replace(/'/g, "\\'")} : ${b.desc.replace(/'/g, "\\'")}${DATA.badges[b.id] ? " ✔" : ""}')">
      <span class="rond">${b.e}</span>${b.nom}</button>`).join("");
  const nbBadges = BADGES.filter(b => DATA.badges[b.id]).length;

  $app.innerHTML = `
  <div class="top">${mascotte(jour >= OBJECTIF_JOUR ? "fete" : "content")}<div><h1>${salut} ${nom()} 👋</h1><small>${pick(accroches)}</small></div></div>

  <div class="accueil">
    <div class="card">
      <div class="profil">
        <div class="niveau-badge">${nv.cur.e}</div>
        <div>
          <div class="niveau-nom"><small>Niveau ${nv.i + 1}</small>${nv.cur.nom}</div>
          <div class="xpbar"><i style="width:${nv.pct}%"></i></div>
          <div class="xptxt">${DATA.xp} XP${nv.suiv ? ` · encore ${nv.suiv.xp - DATA.xp} XP pour « ${nv.suiv.nom} »` : " · niveau maximum !"}</div>
        </div>
      </div>
      <div class="chips">
        <span class="chip fire">🔥 ${serie} jour${serie > 1 ? "s" : ""} de suite</span>
        <span class="chip goal">🎯 ${Math.min(jour, OBJECTIF_JOUR)}/${OBJECTIF_JOUR} aujourd'hui${jour >= OBJECTIF_JOUR ? " ✔" : ""}</span>
        <span class="chip">🏅 ${nbBadges}/${BADGES.length}</span>
      </div>
      <div class="compte">${compteARebours()}</div>
    </div>

    <div>
      <div class="card hero">
        <h2>Examen blanc</h2>
        <p>40 questions, ${DATA.chrono ? "20 secondes chacune, " : ""}correction à la fin. 35 bonnes réponses pour être reçue. +50 XP si tu réussis !</p>
        <button class="btn white" onclick="start('exam')">Examen complet · 40</button>
        <button class="btn demi" onclick="start('demi')">Demi-examen · 20 <small>(18/20 pour réussir)</small></button>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn ghost" onclick="start('quick')">⚡ 20 questions</button>
        <button class="btn ghost" onclick="start('errors')" ${DATA.errors.length ? "" : "disabled"}>🔁 Erreurs (${DATA.errors.length})</button>
      </div>
      <div class="clavier"><span class="kbd">E</span> examen · <span class="kbd">D</span> demi-examen · <span class="kbd">R</span> série rapide · <span class="kbd">M</span> mes erreurs</div>
    </div>

    <div class="plein"><h3>Entraînement par thème</h3><div class="themes">${themes}</div></div>

    <div class="plein"><h3>Mes badges · ${nbBadges}/${BADGES.length}</h3><div class="card"><div class="badges">${badges}</div></div></div>

    <div class="card">
      <div class="stats">
        <div class="stat"><b>${exams.length}</b><span>examens</span></div>
        <div class="stat"><b>${best}${exams.length ? "<small style='font-size:13px'>/40</small>" : ""}</b><span>meilleur score</span></div>
        <div class="stat"><b>${avg}</b><span>moyenne (5 derniers)</span></div>
      </div>
    </div>

    <div class="card">
      <label class="reglage">Prénom <input type="text" maxlength="20" value="${esc(DATA.prenom)}" onchange="DATA.prenom=this.value.trim()||'Nanon';save();home()"></label>
      <label class="reglage">Chronomètre (20 s) en examen blanc <input type="checkbox" ${DATA.chrono ? "checked" : ""} onchange="DATA.chrono=this.checked;save();home()"></label>
      <button class="link" onclick="resetAsk(this)">Réinitialiser ma progression</button>
    </div>
  </div>
  <div class="foot">Questions originales rédigées selon le programme officiel. À compléter par les séries officielles avant l'examen.<br>SV · v${VERSION}</div>`;
  window.scrollTo(0, 0);
}

/* Réinitialisation en deux appuis (pas de boîte de dialogue système) */
function resetAsk(btn){
  if (btn.dataset.armed) {
    DATA = { seen:{}, errors:[], exams:[], chrono:DATA.chrono, xp:0, days:{}, badges:{}, bestCombo:0, prenom:DATA.prenom, demis:[] };
    save(); home(); return;
  }
  btn.dataset.armed = 1; btn.textContent = "Appuie encore pour tout effacer"; btn.style.color = "var(--ko)";
}

/* ---------- 8. Lancement d'une série ----------
   mode : exam (40 q, correction à la fin) | theme | quick | errors (correction immédiate) */
let S = null; // état de la série en cours

function start(mode, theme){
  let pool;
  if (mode === "exam") pool = pickExam(4);
  else if (mode === "demi") pool = pickExam(2);
  else if (mode === "theme") pool = shuffle(QUESTIONS.filter(q => q.theme === theme));
  else if (mode === "errors") pool = shuffle(QUESTIONS.filter(q => DATA.errors.includes(q.id)));
  else pool = shuffle(QUESTIONS).slice(0, 20);
  if (!pool.length) { home(); return; } // ex. plus aucune erreur à revoir

  // On mélange l'ordre des réponses en gardant la trace des bonnes
  const items = pool.map(q => {
    const order = shuffle(q.answers.map((_, i) => i));
    return { q, order, good: order.map((o, i) => q.good.includes(o) ? i : -1).filter(i => i >= 0), picked: [], done: false };
  });
  S = { mode, theme, items, i: 0, combo: 0, xp: 0,
        title: mode === "theme" ? THEMES[theme].name : mode === "exam" ? "Examen blanc" : mode === "demi" ? "Demi-examen" : mode === "errors" ? "Mes erreurs" : "Série rapide" };
  showQuestion();
}

/* Examen blanc : « parTheme » questions par thème, comme la répartition officielle
   (4 par thème = 40 questions ; 2 par thème = demi-examen de 20 questions) */
function pickExam(parTheme){
  let out = [];
  Object.keys(THEMES).forEach(k => { out = out.concat(shuffle(QUESTIONS.filter(q => q.theme === k)).slice(0, parTheme)); });
  return shuffle(out);
}
// Vrai pour les deux formats d'examen (pas de correction avant la fin, chrono)
const estExamen = () => S && (S.mode === "exam" || S.mode === "demi");

/* ---------- 9. Affichage d'une question ---------- */
function showQuestion(){
  const it = S.items[S.i], q = it.q, n = S.items.length;
  const exam = estExamen();
  const letters = "ABCD";
  const answers = it.order.map((o, i) => {
    let cls = it.picked.includes(i) ? "sel" : "";
    if (it.done && !exam) cls = it.good.includes(i) ? "good" : (it.picked.includes(i) ? "bad" : "");
    return `<button class="answer ${cls}" ${it.done ? "disabled" : ""} onclick="toggle(${i})"><span class="letter">${letters[i]}</span><span>${esc(q.answers[o])}</span></button>`;
  }).join("");

  let feedback = "";
  if (it.done && !exam){
    const ok = isRight(it);
    feedback = `<div class="explain ${ok ? "ok" : "ko"}">${mascotte(ok ? (S.combo >= 5 ? "fete" : "content") : "oups")}
      <div><b>${ok ? "✔ " + msg(BRAVO) : "✘ " + msg(OUPS)}</b>${ok ? "" : `<div style="font-weight:700;margin-bottom:4px">Bonne${it.good.length > 1 ? "s" : ""} réponse${it.good.length > 1 ? "s" : ""} : ${it.good.map(i => letters[i]).join(" et ")}</div>`}${esc(q.explain)}</div></div>`;
  }

  // Visuel : le panneau s'il y en a un, sinon l'illustration de la scène
  const visuel = q.sign && SIGNS[q.sign] ? `<div class="sign">${SIGNS[q.sign]}</div>` : `<div class="scene">${SCENES[sceneDe(q)]}</div>`;
  const timer = exam && DATA.chrono ? `<div class="timer"><svg width="44" height="44"><circle cx="22" cy="22" r="19" fill="none" stroke="#d7e4e5" stroke-width="4"/><circle id="tc" cx="22" cy="22" r="19" fill="none" stroke="#0f7c7b" stroke-width="4" stroke-dasharray="119.4" stroke-dashoffset="0" stroke-linecap="round"/></svg><span id="tt">20</span></div>` : "";
  // En examen on n'affiche pas le combo (pas de correction pendant l'épreuve)
  const combo = !exam && S.combo >= 2 ? `<span class="combo">🔥 ×${S.combo}</span>` : "";

  $app.innerHTML = `<div class="quiz">
  <div class="qhead">
    <button class="close" onclick="home()" title="Quitter (Échap)">×</button>
    <div class="prog"><div class="count"><span>${esc(S.title)} · ${S.i + 1}/${n}</span>${combo}</div><div class="bar"><i style="width:${100 * (S.i + 1) / n}%"></i></div></div>
    ${timer}
  </div>
  <div class="qcorps">
    <div class="visuel">${visuel}</div>
    <div>
      <span class="tag">${THEMES[q.theme].ic} ${THEMES[q.theme].name}</span>
      <p class="question">${esc(q.text)}</p>
      <div class="hint">Une ou plusieurs bonnes réponses</div>
      ${answers}
      ${feedback}
      <div class="sticky">${it.done && !exam
         ? `<button class="btn" id="suite" onclick="next()">${S.i + 1 < n ? "Question suivante" : "Voir mon résultat"}</button>`
         : `<button class="btn" id="val" onclick="validate()" ${it.picked.length ? "" : "disabled"}>Valider</button>`}</div>
      <div class="clavier"><span class="kbd">A</span>–<span class="kbd">${letters[it.order.length - 1]}</span> ou <span class="kbd">1</span>–<span class="kbd">${it.order.length}</span> choisir · <span class="kbd">Entrée</span> ${it.done && !exam ? "suivante" : "valider"} · <span class="kbd">Échap</span> quitter</div>
    </div>
  </div></div>`;
  window.scrollTo(0, 0);
  if (exam && DATA.chrono && !it.done) startTimer();
}

/* Sélection / désélection d'une réponse (plusieurs réponses possibles) */
function toggle(i){
  const it = S.items[S.i];
  if (it.done || i >= it.order.length) return;
  it.picked = it.picked.includes(i) ? it.picked.filter(x => x !== i) : it.picked.concat(i);
  // Mise à jour légère sans tout redessiner (le chrono continue)
  document.querySelectorAll(".answer").forEach((b, k) => b.classList.toggle("sel", it.picked.includes(k)));
  document.getElementById("val").disabled = !it.picked.length;
}

/* Une question est juste si les réponses cochées sont exactement les bonnes */
function isRight(it){
  return it.picked.length === it.good.length && it.good.every(g => it.picked.includes(g));
}

/* Validation : statistiques, XP, combo, badges, puis suite */
function validate(){
  stopTimer();
  const it = S.items[S.i];
  if (it.done) return;
  it.done = true;
  const ok = isRight(it), id = it.q.id;
  const st = DATA.seen[id] || { ok:0, ko:0 };
  ok ? st.ok++ : st.ko++;
  DATA.seen[id] = st;
  // Liste « Mes erreurs » : on ajoute si raté, on retire si réussi
  if (!ok && !DATA.errors.includes(id)) DATA.errors.push(id);
  if (ok) DATA.errors = DATA.errors.filter(x => x !== id);
  DATA.erreursMax = Math.max(DATA.erreursMax || 0, DATA.errors.length);
  // Compteur du jour (objectif + série de jours)
  const j = jourCle(); DATA.days[j] = (DATA.days[j] || 0) + 1;
  // XP : 10 par bonne réponse (+5 tous les 5 d'affilée), 2 pour l'effort sinon
  S.combo = ok ? S.combo + 1 : 0;
  DATA.bestCombo = Math.max(DATA.bestCombo, S.combo);
  let gain = ok ? 10 + (S.combo > 0 && S.combo % 5 === 0 ? 5 : 0) : 2;
  S.xp += gain;
  const b = document.getElementById("val").getBoundingClientRect();
  gagnerXP(gain, estExamen() ? null : b.left + b.width / 2, b.top); // en examen : XP discrets
  if (DATA.days[j] === OBJECTIF_JOUR) { toast("🎯", `Objectif du jour atteint, bravo ${DATA.prenom} !`); gagnerXP(20); }
  verifierBadges();
  save();
  if (estExamen()) next(); else showQuestion();
}

function next(){
  if (S.i + 1 < S.items.length){ S.i++; showQuestion(); }
  else results();
}

/* ---------- 10. Chronomètre (20 s par question en examen blanc) ---------- */
let timerId = null;
function startTimer(){
  stopTimer();
  const t0 = Date.now(), D = 20000;
  timerId = setInterval(() => {
    const left = Math.max(0, D - (Date.now() - t0));
    const tt = document.getElementById("tt"), tc = document.getElementById("tc");
    if (tt) tt.textContent = Math.ceil(left / 1000);
    if (tc) { tc.style.strokeDashoffset = 119.4 * (1 - left / D); if (left < 5000) tc.style.stroke = "#d64545"; }
    if (left <= 0) validate(); // temps écoulé : on valide ce qui est coché (vide = faux)
  }, 200);
}
function stopTimer(){ if (timerId) { clearInterval(timerId); timerId = null; } }

/* ---------- 11. Résultats ---------- */
function results(){
  stopTimer();
  const total = S.items.length, score = S.items.filter(isRight).length;
  const exam = estExamen(), demi = S.mode === "demi";
  const letters = "ABCD";
  const seuil = demi ? 18 : 35;            // 35/40 au vrai code ; 18/20 pour le demi-examen
  const passed = exam ? score >= seuil : score / total >= 0.875;
  // Bonus de fin de série (le demi-examen a sa propre liste, pour ne pas fausser les stats sur 40)
  let bonus = 0;
  if (S.mode === "exam") { DATA.exams.push({ date: Date.now(), score }); bonus = (passed ? 50 : 10) + (score === 40 ? 100 : 0); }
  else if (demi) { DATA.demis = (DATA.demis || []).concat({ date: Date.now(), score }); bonus = (passed ? 25 : 5) + (score === 20 ? 40 : 0); }
  else if (score === total && total >= 10) bonus = 30;
  if (bonus) { S.xp += bonus; gagnerXP(bonus); }
  verifierBadges(); save();
  if (passed) setTimeout(confettis, 200);

  const nv = niveau();
  // Verdicts taquins (mais gentils)
  const verdict = exam
    ? (score === total ? `${score}/${total} ?! Qui es-tu et qu'as-tu fait de ${nom()} ? 💎`
      : passed ? `Reçue, ${nom()} ! Bon, ne prends pas la grosse tête 😎`
      : score >= seuil - 5 ? `Tout près ! Il fallait ${seuil}/${total}… si près, si loin 😏`
      : "Hum… on va dire que c'était un échauffement 😅")
    : (score === total ? "Sans faute ! Tu frimes, là 😏" : passed ? `Très bien, ${nom()} !` : "Il va falloir revoir tout ça… avant Papa 😜");

  // Récapitulatif : en examen on montre toutes les corrections, sinon seulement les erreurs
  const list = S.items.filter(it => exam || !isRight(it)).map(it => {
    const ok = isRight(it), q = it.q;
    return `<div class="recap"><div class="q"><span class="pill ${ok ? "ok" : "ko"}">${ok ? "✔" : "✘"}</span>${esc(q.text)}</div>
      <div class="r">Bonne(s) réponse(s) : <b>${it.good.map(i => letters[i] + ". " + esc(q.answers[it.order[i]])).join(" — ")}</b></div>
      ${ok ? "" : `<div class="r">Ta réponse : ${it.picked.length ? it.picked.slice().sort().map(i => letters[i]).join(" ") : "aucune (temps écoulé)"}</div><div class="r">${esc(q.explain)}</div>`}</div>`;
  }).join("");

  $app.innerHTML = `<div class="quiz">
  <div class="card score">
    ${mascotte(passed ? "fete" : "oups")}
    <div class="big">${score}<small>/${total}</small></div>
    <div class="verdict ${passed ? "ok" : "ko"}">${verdict}</div>
    <div style="color:var(--muted);font-size:14px">${score === total ? "Aucune erreur à revoir." : `${total - score} erreur${total - score > 1 ? "s" : ""} ajoutée${total - score > 1 ? "s" : ""} à « Mes erreurs »`}</div>
    <div class="gain">+${S.xp} XP · ${nv.cur.e} ${nv.cur.nom}</div>
    <div class="xpbar" style="max-width:320px;margin:12px auto 0"><i style="width:${nv.pct}%"></i></div>
  </div>
  <div class="row" style="margin-bottom:12px">
    <button class="btn" id="suite" onclick="start('${S.mode}','${S.theme || ""}')">Recommencer</button>
    <button class="btn ghost" onclick="home()">Accueil</button>
  </div>
  ${list ? `<div class="card"><h3 style="margin-top:0">${exam ? "Corrections" : "À revoir"}</h3>${list}</div>` : ""}</div>`;
  window.scrollTo(0, 0);
}

/* ---------- 12. Clavier (PC) ----------
   Accueil : E = examen, R = série rapide, M = mes erreurs.
   Question : A-D ou 1-4 = cocher/décocher, Entrée = valider puis suivante, Échap = accueil. */
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const k = e.key.toLowerCase();
  if (!S) {                                       // accueil
    if (k === "e") start("exam"); else if (k === "d") start("demi"); else if (k === "r") start("quick"); else if (k === "m" && DATA.errors.length) start("errors");
    return;
  }
  if (k === "escape") { home(); return; }
  const it = S.items[S.i];
  const idx = "abcd".indexOf(k) >= 0 ? "abcd".indexOf(k) : "1234".indexOf(k);
  if (idx >= 0 && it && !it.done) { e.preventDefault(); toggle(idx); return; }
  if (k === "enter") {
    e.preventDefault();
    const val = document.getElementById("val"), suite = document.getElementById("suite");
    if (val && !val.disabled) validate(); else if (suite) suite.click();
  }
});

/* ---------- 13. Démarrage + mode hors-ligne ---------- */
home();
// PWA : service worker « réseau d'abord » du site (seulement en https)
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
