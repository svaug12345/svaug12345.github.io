<!doctype html>
<!--
  Page « PochPoch assistant » — le cost killer vocal
  Version 1.2.0 – 31/10/2026
  En ligne : https://baiji.fr/pochpoch/

  Historique :
   • 1.0.0 : première version (fond Matrix, un seul bouton, agent vocal ElevenLabs)
   • 1.1.0 : pendant l'appel, le bouton devient « Raccrocher » (rouge) pour couper clairement
   • 1.2.0 : retour visuel immédiat au clic + écran « ligne ouverte » pendant l'appel
             (voyant qui clignote, chrono, qui parle, onde qui réagit aux voix)

  Comment ça marche ?
  - Le fond est une « pluie de caractères » façon Matrix, dessinée dans un <canvas>.
  - Au repos, un seul bouton : « Demander l'autorisation ».
  - Au clic, 3 états se succèdent (on les appelle « états » dans le code) :
      1. CONNEXION  → texte « Autorisation en cours… » qui s'écrit lettre par lettre,
                      le bouton « respire ». Le navigateur demande le micro.
      2. EN LIGNE   → au-dessus du bouton apparaissent :
                        • un voyant vert clignotant + « LIGNE OUVERTE » + un chrono,
                        • une onde (oscilloscope) qui bouge avec les voix,
                        • qui a la parole : « Pochepoche parle » / « À vous ».
                      Le bouton devient « Raccrocher » (rouge).
      3. REPOS      → après raccrochage (par nous ou par PochPoch), tout disparaît.
  - Pendant l'appel, la pluie s'accélère et s'éclaire quand PochPoch parle.
  - On utilise le SDK officiel « @elevenlabs/client » plutôt que la bulle
    toute faite : ça permet de garder une page totalement épurée.
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- Indispensable pour un bon affichage sur téléphone -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PochPoch</title>
  <!-- « noindex » : la page n'apparaîtra pas sur Google (accessible seulement avec le lien) -->
  <meta name="robots" content="noindex, nofollow">
  <!-- Couleur de la barre du navigateur sur Android -->
  <meta name="theme-color" content="#000000">
  <!-- Police monospace « terminal » -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* ---------- Couleurs (une seule source de vérité) ---------- */
    :root {
      --fond:   #000000;   /* noir total */
      --vert:   #33ff66;   /* vert phosphore façon Matrix */
      --vert-2: #0d3b1a;   /* vert très sombre, pour les bordures au repos */
      --rouge:  #ff3344;   /* raccrocher / erreur */
    }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--fond);
      overflow: hidden;              /* pas de barre de défilement */
    }

    /* Le canvas de la pluie occupe tout l'écran, derrière le reste */
    #pluie {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Conteneur qui centre tout au milieu de l'écran, en colonne */
    main {
      position: relative;            /* au-dessus du canvas */
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 0 16px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      color: var(--vert);
    }

    /* ---------- Le panneau « ligne ouverte » (caché au repos) ---------- */
    #panneau {
      width: min(420px, 100%);
      background: rgba(0, 0, 0, 0.85);   /* fond opaque pour lire par-dessus la pluie */
      border: 1px solid var(--vert);
      box-shadow: 0 0 24px rgba(51, 255, 102, 0.2);
      padding: 14px 16px 12px;
      display: none;                     /* affiché seulement pendant l'appel */
    }
    body.en-ligne #panneau { display: block; animation: apparait .35s ease-out; }

    /* Ligne du haut : voyant + « LIGNE OUVERTE » ……… chrono */
    .entete {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      letter-spacing: 0.16em;
      text-shadow: 0 0 6px rgba(51, 255, 102, 0.5);
    }
    .entete .chrono { margin-left: auto; font-variant-numeric: tabular-nums; }

    /* Le voyant : un petit rond vert qui clignote comme une LED */
    .voyant {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--vert);
      box-shadow: 0 0 10px var(--vert);
      animation: led 1s ease-in-out infinite;
    }

    /* L'oscilloscope : une onde qui bouge avec les voix */
    #onde {
      display: block;
      width: 100%;
      height: 64px;
      margin: 10px 0 6px;
    }

    /* Qui a la parole */
    #parole {
      font-size: 12px;
      letter-spacing: 0.14em;
      opacity: .8;
      text-align: center;
      min-height: 1.2em;
    }

    /* ---------- Le bouton unique ---------- */
    #bouton {
      font-family: inherit;
      font-size: clamp(15px, 2.4vw, 19px);
      letter-spacing: 0.18em;
      color: var(--vert);
      background: rgba(0, 0, 0, 0.82);
      border: 1px solid var(--vert-2);
      padding: 18px 30px;
      cursor: pointer;
      text-shadow: 0 0 8px rgba(51, 255, 102, 0.55);
      transition: border-color .25s, box-shadow .25s, color .25s;
      -webkit-tap-highlight-color: transparent;
    }
    /* Le petit curseur clignotant après le texte, comme dans un terminal */
    #bouton::after {
      content: "_";
      margin-left: 2px;
      animation: clignote 1s steps(1) infinite;
    }
    #bouton:hover,
    #bouton:focus-visible {
      outline: none;
      border-color: var(--vert);
      box-shadow: 0 0 18px rgba(51, 255, 102, 0.25);
    }

    /* Pendant la connexion : bordure allumée + le bouton « respire » */
    body.connexion #bouton {
      border-color: var(--vert);
      cursor: progress;
      animation: respire 1.2s ease-in-out infinite;
    }

    /* Pendant l'appel : le bouton devient « Raccrocher », en rouge */
    body.en-ligne #bouton {
      color: var(--rouge);
      border-color: var(--rouge);
      text-shadow: 0 0 8px rgba(255, 51, 68, 0.6);
      box-shadow: 0 0 20px rgba(255, 51, 68, 0.25);
    }
    body.en-ligne #bouton::after { content: none; }   /* pas de curseur sur Raccrocher */

    /* En cas d'erreur (micro refusé…) : tout passe en rouge */
    body.erreur #bouton {
      color: var(--rouge);
      border-color: var(--rouge);
      text-shadow: 0 0 8px rgba(255, 51, 68, 0.6);
    }

    @keyframes clignote { 50% { opacity: 0; } }
    @keyframes respire  { 50% { opacity: .5; } }
    @keyframes led      { 50% { opacity: .25; box-shadow: none; } }
    @keyframes apparait { from { opacity: 0; transform: translateY(6px); } }

    /* Accessibilité : si l'utilisateur a demandé moins d'animations, on les coupe */
    @media (prefers-reduced-motion: reduce) {
      #bouton::after, body.connexion #bouton, .voyant, #panneau { animation: none !important; }
    }
  </style>
</head>
<body>
  <!-- La pluie Matrix -->
  <canvas id="pluie" aria-hidden="true"></canvas>

  <main>
    <!-- Panneau « ligne ouverte » : invisible au repos, affiché pendant l'appel.
         aria-live : les lecteurs d'écran annoncent les changements de texte. -->
    <section id="panneau" aria-live="polite">
      <div class="entete">
        <span class="voyant" aria-hidden="true"></span>
        <span>LIGNE OUVERTE</span>
        <span class="chrono" id="chrono">00:00</span>
      </div>
      <canvas id="onde" aria-hidden="true"></canvas>
      <div id="parole"></div>
    </section>

    <!-- Le bouton : seule chose visible au repos -->
    <button id="bouton" type="button">Demander l'autorisation</button>
  </main>

  <!-- type="module" : permet d'utiliser « import » pour charger le SDK depuis un CDN -->
  <script type="module">
    /* ============================================================
       1. RÉGLAGES
       ============================================================ */
    const AGENT_ID = "agent_7701m68m6rc2fkra55wnegc6bd80";   // l'agent PochPoch sur ElevenLabs

    // Tous les textes affichés, regroupés ici pour les modifier facilement
    const TEXTES = {
      repos:      "Demander l'autorisation",
      connexion:  "Autorisation en cours…",
      raccrocher: "Raccrocher",
      erreur:     "Accès refusé",
      ilParle:    "▶ POCHEPOCHE PARLE",
      aVous:      "● À VOUS — PARLEZ",
    };

    // Caractères qui tombent : katakana (le côté Matrix), chiffres… et symboles d'argent
    const GLYPHES = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホ0123456789€$£%-";

    const bouton  = document.getElementById("bouton");
    const chrono  = document.getElementById("chrono");
    const parole  = document.getElementById("parole");
    const canvas  = document.getElementById("pluie");
    const ctx     = canvas.getContext("2d");
    const onde    = document.getElementById("onde");
    const ctxOnde = onde.getContext("2d");

    // Respecte le réglage « réduire les animations » du système
    const calme = matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* ============================================================
       2. LA PLUIE MATRIX
       Principe : l'écran est découpé en colonnes. Chaque colonne a
       une « goutte » (sa position verticale). À chaque image, on
       dessine un caractère au niveau de la goutte puis on la descend.
       On ne vide pas l'écran : on le recouvre d'un noir presque
       transparent, ce qui laisse une traînée qui s'estompe.
       ============================================================ */
    const TAILLE = 16;          // taille d'un caractère en pixels
    let gouttes  = [];          // position (en lignes) de la goutte de chaque colonne
    let intensite = 0;          // 0 = calme, 1 = PochPoch parle fort

    function redimensionner() {
      // On adapte les canvas à la taille réelle de l'écran (écrans haute définition compris)
      const ratio = window.devicePixelRatio || 1;
      canvas.width  = innerWidth  * ratio;
      canvas.height = innerHeight * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      const colonnes = Math.ceil(innerWidth / TAILLE);
      gouttes = Array.from({ length: colonnes }, () => -Math.random() * 60);
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, innerWidth, innerHeight);
      redimensionnerOnde();
    }

    let derniere = 0;
    function dessinerPluie(t) {
      requestAnimationFrame(dessinerPluie);

      // Cadence : ~14 images/s au repos, jusqu'à ~40 quand PochPoch s'énerve
      const intervalle = 70 - intensite * 45;
      if (t - derniere < intervalle) return;
      derniere = t;

      ctx.fillStyle = "rgba(0, 0, 0, 0.08)";            // voile = effet de traînée
      ctx.fillRect(0, 0, innerWidth, innerHeight);
      ctx.font = `${TAILLE}px "JetBrains Mono", monospace`;

      for (let i = 0; i < gouttes.length; i++) {
        const y = gouttes[i] * TAILLE;
        const lettre = GLYPHES[Math.floor(Math.random() * GLYPHES.length)];
        const lum = 0.35 + intensite * 0.65;            // plus lumineux quand il parle
        ctx.fillStyle = Math.random() < 0.06
          ? `rgba(200, 255, 210, ${lum})`               // quelques têtes presque blanches
          : `rgba(51, 255, 102, ${lum * 0.8})`;
        ctx.fillText(lettre, i * TAILLE, y);
        if (y > innerHeight && Math.random() > 0.975) gouttes[i] = 0;
        gouttes[i]++;
      }
    }

    /* ============================================================
       3. L'ONDE (oscilloscope du panneau « ligne ouverte »)
       On dessine une sinusoïde dont la hauteur suit le volume :
       - verte et ample quand PochPoch parle,
       - plus fine quand c'est vous qui parlez,
       - presque plate (mais vivante) dans les silences.
       ============================================================ */
    let phase = 0;              // fait « avancer » l'onde dans le temps
    let volumeLisse = 0;        // volume lissé, pour une onde fluide

    function redimensionnerOnde() {
      const ratio = window.devicePixelRatio || 1;
      onde.width  = onde.clientWidth  * ratio;
      onde.height = onde.clientHeight * ratio;
      ctxOnde.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function dessinerOnde(volume) {
      const l = onde.clientWidth, h = onde.clientHeight, milieu = h / 2;
      ctxOnde.clearRect(0, 0, l, h);

      // Ligne de base discrète
      ctxOnde.strokeStyle = "rgba(51, 255, 102, 0.15)";
      ctxOnde.lineWidth = 1;
      ctxOnde.beginPath();
      ctxOnde.moveTo(0, milieu);
      ctxOnde.lineTo(l, milieu);
      ctxOnde.stroke();

      // L'onde elle-même : amplitude minimale de 2 px pour montrer que la ligne « vit »
      const amplitude = 2 + volume * (h / 2 - 4);
      ctxOnde.strokeStyle = "#33ff66";
      ctxOnde.lineWidth = 2;
      ctxOnde.shadowColor = "#33ff66";
      ctxOnde.shadowBlur = 8;
      ctxOnde.beginPath();
      for (let x = 0; x <= l; x += 2) {
        // Deux sinusoïdes mélangées = un signal moins « parfait », plus organique.
        // L'enveloppe sin(π·x/l) fait que l'onde est nulle aux deux bords.
        const enveloppe = Math.sin(Math.PI * x / l);
        const y = milieu + enveloppe * amplitude *
          (0.7 * Math.sin(x * 0.045 + phase) + 0.3 * Math.sin(x * 0.11 - phase * 1.7));
        x === 0 ? ctxOnde.moveTo(x, y) : ctxOnde.lineTo(x, y);
      }
      ctxOnde.stroke();
      ctxOnde.shadowBlur = 0;
      phase += 0.15;
    }

    addEventListener("resize", redimensionner);
    redimensionner();
    if (!calme) requestAnimationFrame(dessinerPluie);

    /* ============================================================
       4. LES ÉTATS DE LA PAGE
       On met une classe sur <body> (« connexion », « en-ligne »,
       « erreur ») : le CSS se charge de tout afficher/cacher.
       ============================================================ */
    function etat(nom) {
      document.body.className = nom || "";
    }

    // Écrit un texte lettre par lettre dans le bouton (effet terminal)
    let machineAEcrire = null;
    function ecrire(texte) {
      clearInterval(machineAEcrire);
      if (calme) { bouton.textContent = texte; return; }
      let i = 0;
      bouton.textContent = "";
      machineAEcrire = setInterval(() => {
        bouton.textContent = texte.slice(0, ++i);
        if (i >= texte.length) clearInterval(machineAEcrire);
      }, 35);
    }

    // Chrono de l'appel (mm:ss)
    let debutAppel = 0, minuterie = null;
    function lancerChrono() {
      debutAppel = Date.now();
      chrono.textContent = "00:00";
      minuterie = setInterval(() => {
        const s = Math.floor((Date.now() - debutAppel) / 1000);
        // padStart(2, "0") ajoute un zéro devant : 7 → "07"
        chrono.textContent =
          String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
      }, 1000);
    }

    /* ============================================================
       5. L'APPEL VOCAL AVEC POCHPOCH
       ============================================================ */
    let conversation = null;    // la session en cours (null = pas d'appel)
    let boucle = null;          // boucle d'animation pendant l'appel
    let parle  = false;         // true quand PochPoch a la parole

    // Remet tout dans l'état de départ
    function repos() {
      cancelAnimationFrame(boucle);
      clearInterval(minuterie);
      conversation = null;
      intensite = 0;
      volumeLisse = 0;
      parole.textContent = "";
      etat("");
      ecrire(TEXTES.repos);
    }

    // Affiche brièvement une erreur, puis revient au repos
    function erreur(message) {
      console.error("PochPoch :", message);
      cancelAnimationFrame(boucle);
      clearInterval(minuterie);
      conversation = null;
      etat("erreur");
      ecrire(TEXTES.erreur);
      setTimeout(repos, 2500);
    }

    // Pendant l'appel, 60 fois par seconde : on lit les volumes et on anime
    function animerAppel() {
      if (!conversation) return;
      // getOutputVolume() = voix de PochPoch, getInputVolume() = votre micro (entre 0 et 1)
      const sortie = Math.min(1, conversation.getOutputVolume() * 2.5);
      const entree = Math.min(1, conversation.getInputVolume() * 2.5);
      const v = parle ? sortie : entree * 0.6;   // votre voix fait une onde plus petite
      // Lissage (moyenne glissante) pour éviter un effet stroboscope
      volumeLisse = volumeLisse * 0.75 + v * 0.25;
      intensite   = intensite * 0.8 + sortie * 0.2;
      dessinerOnde(volumeLisse);
      boucle = requestAnimationFrame(animerAppel);
    }

    bouton.addEventListener("click", async () => {
      // --- Clic pendant l'appel : on raccroche ---
      if (conversation) {
        await conversation.endSession();
        return;   // onDisconnect se charge de remettre la page au repos
      }
      if (document.body.classList.contains("connexion")) return;   // évite les doubles clics

      // Retour visuel IMMÉDIAT : on montre que la demande est partie
      etat("connexion");
      ecrire(TEXTES.connexion);

      try {
        // 1) Le navigateur demande l'accès au micro (obligatoire pour parler)
        await navigator.mediaDevices.getUserMedia({ audio: true });

        // 2) On charge le SDK ElevenLabs seulement maintenant (page plus légère au départ).
        //    Version figée (1.32.1) pour éviter qu'une mise à jour casse la page.
        const { Conversation } = await import(
          "https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.32.1/+esm"
        );

        // 3) On ouvre la conversation avec l'agent
        conversation = await Conversation.startSession({
          agentId: AGENT_ID,

          // La ligne est ouverte : on affiche le panneau et on lance chrono + onde
          onConnect: () => {
            etat("en-ligne");
            ecrire(TEXTES.raccrocher);
            redimensionnerOnde();      // le canvas vient d'apparaître : on mesure sa taille
            lancerChrono();
            parole.textContent = TEXTES.ilParle;   // il commence par son message d'accueil
            parle = true;
            animerAppel();
          },

          // Qui a la parole ? mode = "speaking" (il parle) ou "listening" (il vous écoute)
          onModeChange: ({ mode }) => {
            parle = mode === "speaking";
            parole.textContent = parle ? TEXTES.ilParle : TEXTES.aVous;
          },

          onDisconnect: repos,            // PochPoch a raccroché (ou nous)
          onError: (e) => erreur(e),
        });
      } catch (e) {
        // Micro refusé, pas de réseau, agent indisponible…
        erreur(e);
      }
    });
  </script>
</body>
</html>
