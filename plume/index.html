<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- L'appli « Plume » s'appelle désormais « Paraphe » : on redirige vers sa nouvelle adresse.
     Les polices déjà créées sont conservées (le stockage du navigateur est lié au site, pas au dossier). -->
<meta http-equiv="refresh" content="0; url=/paraphe/">
<title>Paraphe</title>
<script>
  // On désinstalle l'ancien service worker de /plume/ puis on part vers /paraphe/
  if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations()
    .then(rs => Promise.all(rs.filter(r => r.scope.endsWith("/plume/")).map(r => r.unregister())))
    .finally(() => location.replace("/paraphe/"));
  else location.replace("/paraphe/");
</script>
</head>
<body><p>L'appli s'appelle maintenant <a href="/paraphe/">Paraphe</a>.</p></body>
</html>
