<!DOCTYPE html>
<!--
  ============================================================
  baiji.fr — Page d'accueil des projets (marque SV)
  Version 1.10.0
  ------------------------------------------------------------
  Historique :
   • v1.0.0 : première page d'accueil
   • v1.0.1 : activation du lien "Mes Révisions"
   • v1.0.2 : vrai logo SV (le geste), couleurs + police
              de la charte SV, formulation sans "je/mes"
   • v1.0.3 : activation du lien "Paraphe" (dossier paraphe/)
   • v1.1.0 : serrure d'accès + log des visites (via gate.js), sur la page d'accueil
   • v1.2.0 : nouvelle section « Agents vocaux » (PochPoch, Assistant fournisseurs)
   • v1.3.0 : ajout de « Salle de négociation » dans « Agents vocaux »
   • v1.4.0 : ajout de « Entretien tuteur » dans « Agents vocaux »
   • v1.5.0 : ajout de « SOS Amitié Baiji » dans « Agents vocaux » ;
              pied de page remis à la bonne version
   • v1.5.1 : la carte s'appelle simplement « SOS Amitié »
   • v1.6.0 : ajout de « Négo avec Papa » dans « Agents vocaux »
   • v1.7.0 : ajout de « Pressoir vidéo » dans « Applications »
   • v1.8.0 : un picto par projet dans la pastille (au lieu de l'initiale) ;
              page installable sur téléphone (manifest.webmanifest, sw.js,
              icônes dans icones/ — fabriqués par outils/generer-pwa.py)
   • v1.9.0 : ajout de « Foot & Chats » (Titouan et Ava) dans « Agents vocaux »
   • v1.10.0 : nouvelle section « Sites » avec « Juju · Mécanicien vélo »

  À déposer dans le dépôt GitHub : svaug12345.github.io
  → c'est le fichier "index.html" à la racine.
  (Le favicon "favicon.svg" est déposé à côté, à la racine.)

  COMMENT MODIFIER LES LIENS (le plus important) :
  Tout en bas, dans la partie <script>, il y a une liste
  nommée "PROJETS". Pour activer un lien, on remplace
  url: null  par l'adresse, par exemple  url: "revisions/".
  Tant que url vaut null, la carte affiche un badge "Bientôt"
  et n'est pas cliquable (pas de lien cassé).
  Pour AJOUTER un projet : copier un bloc { ... } et l'adapter.
  ============================================================
-->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Rend la page adaptée aux écrans de téléphone (indispensable) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Serrure de curiosité + log des visites (code et explications dans gate.js).
       Placé tout en haut pour s'exécuter avant l'affichage de la page.
       ⚠️ Uniquement sur cette page d'accueil : on ne met PAS gate.js dans les
       applis (QR/, paraphe/, …) pour ne pas gêner les PWA du Play Store. -->
  <script src="/gate.js"></script>

  <title>baiji — projets</title>
  <meta name="description" content="Les applications et les jeux faits maison, réunis sous la marque SV.">

  <!-- Favicon : l'icône d'appli SV (tuile turquoise + geste blanc) -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!--
    PWA = page installable sur téléphone (« Ajouter à l'écran d'accueil »).
     • le manifeste donne le nom, les couleurs et les icônes de l'appli ;
     • apple-touch-icon = l'icône utilisée par les iPhone ;
     • theme-color = couleur de la barre d'état Android.
    Le service worker (sw.js) est enregistré tout en bas de la page.
  -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png">
  <meta name="theme-color" content="#f6f9f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1a1c" media="(prefers-color-scheme: dark)">

  <!--
    Police de la charte SV : Manrope, chargée depuis Google Fonts.
    preconnect = ouvre la connexion plus tôt pour un chargement rapide.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    /*
      ---- COULEURS DE LA CHARTE SV ----
      Reprises telles quelles de la charte "SV" (jetons de couleur).
      On les définit une seule fois ici ; partout ailleurs on écrit
      var(--nom). Pour tout changer, il suffit de modifier ces lignes.
      Thème clair par défaut.
    */
    :root {
      --surface:        #f6f9f9;  /* fond de page */
      --surface-raised: #ffffff;  /* fond des cartes */
      --line:           #d6e2e3;  /* filets et bordures 1px */
      --ink:            #102a2e;  /* texte principal + logo */
      --ink-muted:      #4d6468;  /* texte secondaire, crédits */
      --teal:           #0f7c7b;  /* couleur de marque */
      --on-teal:        #ffffff;  /* texte/icône sur fond teal */
      --teal-deep:      #0b4f55;  /* variante foncée */
      --teal-soft:      #d4ecea;  /* teinte de relief, badges */
      --accent:         #20b2a6;  /* turquoise vif, touches déco */
    }

    /*
      ---- MODE SOMBRE AUTOMATIQUE ----
      Si l'appareil est réglé en thème sombre, on bascule sur les
      valeurs "Sombre" de la charte. Rien d'autre à changer.
    */
    @media (prefers-color-scheme: dark) {
      :root {
        --surface:        #0e1a1c;
        --surface-raised: #152427;
        --line:           #26393c;
        --ink:            #e6f1f1;
        --ink-muted:      #9db3b5;
        --teal:           #3cc2b8;
        --on-teal:        #062022;
        --teal-deep:      #1d6b6e;
        --teal-soft:      #1c4245;
        --accent:         #5fe0d2;
      }
    }

    /* Remise à zéro de base + réglages globaux */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      /* Manrope (charte SV), avec repli système si elle ne charge pas */
      font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--surface);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 0 16px; /* marge d'écran sur mobile (jeton space-4 de la charte) */
    }

    /* Conteneur central : limite la largeur et centre le contenu */
    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 56px 0 72px;
    }

    /* ---- EN-TÊTE ---- */
    header { text-align: center; margin-bottom: 48px; }

    /* Le logo SV "le geste". Il hérite de la couleur du texte ;
       on lui donne la couleur de marque (teal) via "color". */
    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      display: block;
      color: var(--teal);
    }
    .logo svg { width: 100%; height: 100%; display: block; }

    h1 {
      font-size: 2rem;        /* ~ style h1 de la charte */
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    /* Le ".fr" en couleur de marque, plus discret */
    h1 .ext { color: var(--teal); font-weight: 700; }

    .tagline {
      color: var(--ink-muted);
      margin-top: 8px;
      font-size: 1rem;
    }

    /* ---- TITRE DE SECTION (Applications / Jeux) ---- */
    .section-titre {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;   /* style "label" de la charte */
      color: var(--teal);
      font-weight: 700;
      margin: 40px 4px 16px;
    }

    /* ---- GRILLE DE CARTES ----
       Les cartes se rangent en colonnes qui s'adaptent : au moins
       240px chacune ; plusieurs côte à côte s'il y a la place,
       sinon l'une sous l'autre (parfait sur téléphone). */
    .grille {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }

    /* ---- UNE CARTE PROJET ---- */
    .carte {
      background: var(--surface-raised);
      border: 1px solid var(--line);
      border-radius: 12px;      /* jeton radius-md de la charte */
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;    /* enlève le soulignement des liens */
      color: inherit;           /* garde la couleur de texte normale */
      transition: transform .15s ease, border-color .15s ease;
    }
    /* Au survol/toucher, une carte cliquable "monte" légèrement */
    .carte.cliquable:hover {
      transform: translateY(-3px);
      border-color: var(--teal);
    }

    /* La pastille à gauche : tuile turquoise avec le picto du projet,
       dans l'esprit de l'icône d'appli SV. */
    .pastille {
      flex: 0 0 44px;   /* largeur fixe, ne se déforme pas */
      height: 44px;
      border-radius: 10px;
      background: var(--teal);
      color: var(--on-teal);
      font-weight: 800;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Le picto dessiné dans la pastille : un trait (stroke) qui prend
       la couleur du texte de la pastille grâce à "currentColor". */
    .pastille svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* Projet pas encore en ligne : pastille en teinte douce */
    .carte:not(.cliquable) .pastille {
      background: var(--teal-soft);
      color: var(--teal);
    }

    .carte-texte { min-width: 0; } /* évite que le texte déborde */
    .carte-nom  { font-weight: 700; font-size: 1.02rem; }
    .carte-desc { color: var(--ink-muted); font-size: 0.86rem; margin-top: 2px; }

    /* Le petit badge "Bientôt" pour les projets sans lien encore */
    .badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
      background: var(--teal-soft);
      border-radius: 999px;
      padding: 3px 9px;
      margin-top: 6px;
    }

    /* ---- PIED DE PAGE ---- */
    footer {
      text-align: center;
      color: var(--ink-muted);
      font-size: 0.8rem;
      margin-top: 56px;
    }
    footer .marque { color: var(--teal); font-weight: 700; }
  </style>
</head>

      Les sections (Applications, Jeux) sont générées

    -->

  <script>
    /*
      ============================================================
      LISTE DES PROJETS
      ------------------------------------------------------------
      Seul endroit à modifier au quotidien.
      Chaque projet est un objet { ... } avec :
        - nom  : le titre affiché
        - desc : une phrase courte de description
        - url  : l'adresse du projet
                 • "QR/"  → ouvre baiji.fr/QR/ (chemin relatif)
                 • "https://..." → lien externe (Play Store, etc.)
                 • null   → pas encore de lien : affiche "Bientôt"

        - cat  : la catégorie ("Applications" ou "Jeux")
      ============================================================
    */

      ============================================================
      PICTOS (icônes des cartes)
      ------------------------------------------------------------

      https://lucide.dev). Chaque picto est l'intérieur d'un SVG
      dessiné sur une grille de 24 × 24 : des traits (path, rect,
      circle) sans remplissage. La couleur et l'épaisseur du trait
      sont réglées dans le CSS (.pastille svg).

      poignee: `<path d="m11 17 2 2a1 1 0 1 0 3-3"/> <path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/> <path d="m21 3 1 11h-2"/> <path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/> <path d="M3 4h8"/>`,  // handshake
      toque: `<path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/> <path d="M22 10v6"/> <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>`,  // graduation-cap
      telephone: `<path d="M13 2a9 9 0 0 1 9 9"/> <path d="M13 6a5 5 0 0 1 5 5"/> <path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/>`,  // phone-call
      balance: `<path d="M12 3v18"/> <path d="m19 8 3 8a5 5 0 0 1-6 0zV7"/> <path d="M3 7h1a17 17 0 0 0 8-2 17 17 0 0 0 8 2h1"/> <path d="m5 8 3 8a5 5 0 0 1-6 0zV7"/> <path d="M7 21h10"/>`,  // scale
      velo: `<circle cx="18.5" cy="17.5" r="3.5"/> <circle cx="5.5" cy="17.5" r="3.5"/> <circle cx="15" cy="5" r="1"/> <path d="M12 17.5V14l-3-3 4-3 2 3h2"/>`,  // bike
    };
    const PROJETS = [
      {
        nom:  "Lecteur QR",
        icone: "qr",                      // picto (voir la liste PICTOS)
        desc: "Scanner de QR codes, caméra et galerie",
        url:  "QR/",                     // ✅ en ligne : baiji.fr/QR/
        cat:  "Applications"
      },
      {
        nom:  "Paraphe",
        icone: "signature",               // picto (voir la liste PICTOS)
        desc: "Crée une police à partir d'une écriture",
        url:  "paraphe/",                // ✅ en ligne : baiji.fr/paraphe/
        cat:  "Applications"
      },
      {
        nom:  "Mes Révisions",
        icone: "livre",                   // picto (voir la liste PICTOS)
        desc: "Réviser les leçons en s'amusant",
        url:  "svaug12345-revisions/",   // ✅ en ligne : baiji.fr/svaug12345-revisions/
        cat:  "Applications"
      },
      {
        nom:  "Pressoir vidéo",
        icone: "video",                   // picto (voir la liste PICTOS)
        desc: "Compresse une vidéo dans le téléphone, sans pub",
        url:  "pressoir/",               // ✅ en ligne : baiji.fr/pressoir/

      },
      {
        nom:  "Undercover",
        icone: "masque",                  // picto (voir la liste PICTOS)
        desc: "Jeu de mots et d'imposteur entre amis",
        url:  null,                      // ⬅️ lien à compléter
        cat:  "Jeux"
      },
      {
        nom:  "Unknown Waters",
        icone: "vagues",                  // picto (voir la liste PICTOS)
        desc: "Casse-brique, ambiance graphique épurée",
        url:  null,                      // ⬅️ lien à compléter
        cat:  "Jeux"
      },
      // Nouvelle catégorie : il suffit d'écrire un nouveau nom dans « cat »,
      // le script crée tout seul la section correspondante.
      {
        nom:  "PochPoch",
        icone: "cochon",                  // picto (voir la liste PICTOS)
        desc: "Le cost killer vocal qui refuse vos dépenses",
        url:  "pochpoch/",               // ✅ en ligne : baiji.fr/pochpoch/

      },
      {
        nom:  "Assistant fournisseurs",
        icone: "camion",                  // picto (voir la liste PICTOS)
        desc: "Aide vocale pour rejoindre Carrefour sur SAP Business Network",
        url:  "assistant-fournisseurs/", // ✅ en ligne : baiji.fr/assistant-fournisseurs/

      },
      {
        nom:  "Salle de négociation",

      {

        url:  "foot-chats/",             // ✅ en ligne : baiji.fr/foot-chats/

      {

        url:  "juju/",                   // ✅ en ligne : baiji.fr/juju/
        cat:  "Sites"
      }
    ];

    // ---- Construction de la page à partir de la liste ci-dessus ----

    // 1) Zone où injecter le contenu
    const contenu = document.getElementById("contenu");

    // 2) Catégories présentes, sans doublon, dans l'ordre d'apparition
    const categories = [...new Set(PROJETS.map(p => p.cat))];

    // 3) Pour chaque catégorie : un titre, puis la grille de cartes
    categories.forEach(cat => {
      const titre = document.createElement("h2");
      titre.className = "section-titre";
      titre.textContent = cat;
      contenu.appendChild(titre);

      const grille = document.createElement("div");
      grille.className = "grille";

      PROJETS.filter(p => p.cat === cat).forEach(projet => {
        // Carte = lien <a> si une url existe, sinon <div> non cliquable
        const aUnLien = projet.url !== null;
        const carte = document.createElement(aUnLien ? "a" : "div");
        carte.className = "carte" + (aUnLien ? " cliquable" : "");
        if (aUnLien) carte.href = projet.url;

        // Le picto du projet. S'il manque (oubli, faute de frappe),
        // on retombe sur l'initiale : la carte reste toujours lisible.
        const picto = PICTOS[projet.icone];
        const dansPastille = picto
          ? `<svg viewBox="0 0 24 24" aria-hidden="true">${picto}</svg>`
          : projet.nom.trim().charAt(0).toUpperCase();

        // Contenu de la carte ; sans lien → badge "Bientôt" à la place de la description
        carte.innerHTML = `
          <div class="pastille">${dansPastille}</div>
          <div class="carte-texte">
            <div class="carte-nom">${projet.nom}</div>
            ${ aUnLien
                ? `<div class="carte-desc">${projet.desc}</div>`
                : `<span class="badge">Bientôt</span>` }
          </div>
        `;

        grille.appendChild(carte);
      });

      contenu.appendChild(grille);
    });

    // ---- Page installable : enregistrement du service worker ----
    // Le navigateur exige un site en https (c'est le cas de baiji.fr).
    // Le fichier sw.js (racine) n'agit que sur les fichiers de l'accueil,
    // jamais sur les dossiers des autres applis.
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      navigator.serviceWorker.register("/sw.js", { scope: "/" });
    }
  </script>
