<!DOCTYPE html>
<!--
  Médiathèque — les documents empruntés aux Médiathèques de Paris-Saclay, avec leurs couvertures
  Version 1.5.1
  Les données viennent du service « biblio » du NAS (https://biblio.baiji.fr/prets.json),
  qui se connecte au compte lecteur et relit le site toutes les 3 heures.
  La page ne contient aucun identifiant et ne parle jamais directement au compte lecteur.
  Historique :
   • v1.0.0 : couvertures groupées par date de retour, filtres par type et par médiathèque,
              fiche détaillée, lien pour prolonger sur le site, dernières données hors ligne
   • v1.0.1 : 3 colonnes de couvertures sur téléphone ; couvertures entières, jamais coupées
   • v1.0.2 : fiche d'un document avec une grande couverture en haut
   • v1.0.3 : correction : la grande couverture restait invisible (hauteur nulle, jamais chargée)
   • v1.0.4 : compteur de visites de baiji.fr (/journal.js)
   • v1.1.0 : mode « Check » : on touche chaque document rendu par les enfants,
              puis « Terminer » montre ceux qui manquent (coches gardées sur l'appareil)
   • v1.2.0 : en mode Check, un document coché s'efface et part dans « Déjà récupérés »,
              repliée tout en bas : à l'écran, il ne reste que les manquants
   • v1.3.0 : en mode Check, une loupe sur chaque couverture ouvre la fiche (couverture en
              grand) ; la fiche a alors un bouton « Récupéré » pour cocher depuis là
   • v1.4.0 : « Ma carte » : la carte de bibliothèque à présenter au comptoir, code-barres
              Codabar dessiné par la page ; le numéro reste dans le téléphone (jamais dans le code)
   • v1.5.0 : plus aucune proposition de prolongation (bouton, badge « Non prolong. », ligne
              « Prolongeable ») ; lien vers le site des médiathèques sous la carte
   • v1.5.1 : si le site ne donne pas les prêts (carte en erreur et liste vide), l'appli garde
              les derniers prêts connus du téléphone, et n'affiche plus « Rien à rendre »
-->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover : l'appli occupe tout l'écran, y compris sous l'encoche du téléphone -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Médiathèque</title>
  <meta name="description" content="Les documents empruntés aux Médiathèques de Paris-Saclay.">

  <!-- Page familiale : on ne la fait pas apparaître dans les moteurs de recherche -->
  <meta name="robots" content="noindex">

  <!--
    PWA = page installable sur téléphone (menu du navigateur → « Installer l'application »).
    Fichiers fabriqués par outils/generer-pwa.py :
     • manifest.webmanifest : nom, couleurs, icônes de l'appli ;
     • icones/ : les icônes (apple-touch-icon = celle des iPhone) ;
     • sw.js : le service worker, enregistré en bas de page.
  -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <link rel="icon" href="icones/icone-192.png">
  <meta name="theme-color" content="#0e3a44">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Polices de la charte SV : Manrope (texte) et JetBrains Mono (chiffres) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       1. COULEURS (variables CSS) — charte SV
       Définies une seule fois ; tout le reste les réutilise.
       ========================================================= */
    :root {
      --bg: #f3f6f6;          /* fond de page */
      --card: #ffffff;        /* fond des cartes */
      --ink: #10282d;         /* texte principal */
      --muted: #5d7277;       /* texte secondaire */
      --line: #dfe7e8;        /* traits de séparation */
      --soft: #edf3f3;        /* fonds discrets (pastilles) */
      --brand: #0e3a44;       /* bleu-vert foncé SV */
      --accent: #0f7c7b;      /* teal SV */
      --warn: #b45309;        /* orange : à rendre dans la semaine */
      --bad: #b91c1c;         /* rouge : à rendre dans 3 jours ou moins, ou en retard */
      --good: #15803d;        /* vert : récupéré (mode Check) */
      --radius: 18px;
    }
    /* Thème sombre automatique si le téléphone est en mode sombre */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #071a1f; --card: #0f262c; --ink: #e8f1f2; --muted: #93a9ad; --line: #1d3a41; --soft: #15323a;
        --warn: #f59e0b; --bad: #f87171; --good: #4ade80; --accent: #2bb3b1;
      }
    }

    /* =========================================================
       2. BASE
       ========================================================= */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Manrope', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      /* "safe-area" = marges de l'encoche et de la barre de navigation Android */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    svg { display: block; }
    [hidden] { display: none !important; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

    #app { max-width: 760px; margin: 0 auto; padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 14px; }
    .card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }

    /* Bouton principal de la charte SV : capitales espacées */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--accent); color: #fff; border-radius: 12px; padding: 12px 16px;
      font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; text-decoration: none;
    }
    .btn.secondaire { background: var(--soft); color: var(--ink); }

    /* =========================================================
       3. EN-TÊTE
       ========================================================= */
    .top { display: flex; justify-content: space-between; align-items: flex-end; padding: 4px 2px 0; gap: 8px; }
    .brand { font-size: 11px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
    .titre { font-size: 24px; font-weight: 800; line-height: 1.15; }
    .icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); flex: none; }
    .icon-btn:active { background: var(--line); }
    .icon-btn svg { width: 20px; height: 20px; }
    .spin svg { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Bandeau d'alerte : données anciennes ou connexion au site en échec */
    .bandeau { background: var(--soft); border-left: 4px solid var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 13px; font-weight: 600; }

    /* =========================================================
       4. PROCHAIN RETOUR (le plus important : en haut)
       ========================================================= */
    .prochain { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-left: 5px solid var(--c, var(--accent)); }
    .prochain small { display: block; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
    .prochain b { display: block; font-size: 20px; font-weight: 800; line-height: 1.2; }
    .prochain span { font-size: 14px; font-weight: 700; color: var(--c, var(--muted)); }

    /* =========================================================
       5. FILTRES (pastilles)
       ========================================================= */
    .filtres { display: flex; flex-wrap: wrap; gap: 6px; }
    .filtre {
      padding: 7px 12px; border-radius: 999px; background: var(--card); color: var(--muted);
      font-size: 13px; font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.05);
    }
    .filtre em { font-style: normal; opacity: .65; margin-left: 3px; }
    .filtre[aria-pressed="true"] { background: var(--brand); color: #fff; }
    @media (prefers-color-scheme: dark) { .filtre[aria-pressed="true"] { background: var(--accent); } }

    /* =========================================================
       6. COUVERTURES, groupées par date de retour
       ========================================================= */
    .groupe-titre { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 12px; }
    .groupe-titre h2 { font-size: 17px; font-weight: 800; }
    .groupe-titre span { font-size: 12px; font-weight: 800; color: var(--c, var(--muted)); white-space: nowrap; }

    /* auto-fill : autant de colonnes que la largeur le permet (3 sur téléphone, 5 ou 6 sur ordinateur) */
    .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 16px 12px; }
    .doc { display: flex; flex-direction: column; gap: 6px; text-align: left; min-width: 0; }
    .doc:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

    /* La couverture : format livre (2/3). L'image est posée par-dessus une tuile de couleur :
       s'il n'y a pas d'image, ou si elle ne se charge pas, on voit la tuile. */
    .couv {
      position: relative; display: block; width: 100%; aspect-ratio: 2 / 3; border-radius: 8px; overflow: hidden;
      background: var(--t, var(--brand)); box-shadow: 0 2px 8px rgba(0,0,0,.18);
    }
    /* contain : la couverture reste entière, même pour un album presque carré. Le fond de
       l'image remplit les bandes vides et cache le titre de la tuile placée dessous. */
    .couv img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: var(--soft); }
    .couv .repli {
      position: absolute; inset: 0; display: grid; place-items: center; padding: 8px;
      color: #fff; font-size: 13px; font-weight: 800; line-height: 1.25; text-align: center; overflow: hidden;
    }
    .doc .t {
      font-size: 13px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere;
      /* titre sur 2 lignes au plus, avec « … » */
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .doc .a { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -3px; }
    .fixe {
      position: absolute; right: 4px; bottom: 4px; background: rgba(0,0,0,.72); color: #fff;
      font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 5px;
    }

    .vide { text-align: center; color: var(--muted); padding: 28px 8px; font-weight: 600; }
    .vide strong { display: block; font-size: 30px; margin-bottom: 4px; }
    .pied { text-align: center; font-size: 12px; color: var(--muted); padding-top: 4px; line-height: 1.6; }

    /* =========================================================
       7. FICHE D'UN DOCUMENT (fenêtre <dialog> du navigateur)
       ========================================================= */
    dialog {
      margin: auto; width: min(460px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); overflow-y: auto;
      border: 0; border-radius: var(--radius); background: var(--card); color: var(--ink); padding: 16px;
    }
    dialog::backdrop { background: rgba(4, 18, 22, .65); }
    /* La grande couverture, centrée en haut de la fiche. Le cadre au format livre a une taille
       fixe : il ne saute pas pendant le chargement. min() limite aussi sa hauteur sur petit écran. */
    .fiche-visuel { width: min(300px, 78%, 38dvh); margin: 0 auto 14px; }
    .fiche-haut h2 { font-size: 18px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
    .fiche-haut p { font-size: 14px; color: var(--muted); margin-top: 4px; }
    .etiquette { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); margin-top: 8px; }
    .fermer { position: absolute; top: 8px; right: 8px; z-index: 2; background: var(--soft); }
    .lignes { margin-top: 14px; }
    .lignes div { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
    .lignes dt { color: var(--muted); font-weight: 600; }
    .lignes dd { font-weight: 700; text-align: right; }
    .oui { color: var(--good); }
    .non { color: var(--bad); }
    /* Barre : part de la durée du prêt déjà écoulée */
    .duree { height: 6px; border-radius: 6px; background: var(--soft); overflow: hidden; margin-top: 4px; }
    .duree i { display: block; height: 100%; background: var(--c, var(--accent)); }
    .boutons { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }

    /* =========================================================
       8. MODE CHECK (récupérer les livres auprès des enfants)
       ========================================================= */
    /* Bouton « Check » de l'en-tête : allumé quand le mode est actif */
    .icon-btn[aria-pressed="true"] { background: var(--accent); color: #fff; }

    /* Barre collée en haut de l'écran : elle reste visible pendant qu'on fait défiler les couvertures */
    .check-barre {
      position: sticky; top: calc(env(safe-area-inset-top) + 8px); z-index: 5;
      display: flex; flex-direction: column; gap: 10px; border-left: 5px solid var(--good);
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
    }
    .check-haut { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .check-haut small { display: block; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .check-haut b { font-size: 20px; font-weight: 800; }
    .check-barre .duree { margin-top: 0; height: 8px; }
    .check-barre .duree i { background: var(--good); transition: width .25s; }
    .check-boutons { display: flex; gap: 8px; }
    .check-boutons .btn { flex: 1; padding: 11px 10px; }

    /* Une couverture cochée : voile vert + grosse coche (les cochés partent ensuite en bas,
       les manquants restent donc en pleines couleurs) */
    .checking .doc .couv { transition: transform .12s; }
    .checking .doc:active .couv { transform: scale(.95); }
    .doc .coche-ok {
      position: absolute; inset: 0; display: none; place-items: center;
      background: rgba(21, 128, 61, .55); color: #fff;
    }
    .doc .coche-ok svg { width: 46%; height: auto; filter: drop-shadow(0 2px 4px rgba(0,0,0,.35)); }
    .checking .doc.coche .coche-ok { display: grid; }
    .checking .doc.coche .t { color: var(--good); }

    /* La loupe : en mode Check, toucher la couverture coche le livre ; ce petit rond en haut
       à droite ouvre plutôt la fiche, avec la couverture en grand. 34 px : assez gros pour le doigt. */
    .loupe {
      position: absolute; top: 4px; right: 4px; z-index: 1; width: 34px; height: 34px; border-radius: 50%;
      display: none; place-items: center; background: rgba(0,0,0,.62); color: #fff;
    }
    .loupe svg { width: 18px; height: 18px; }
    .checking .loupe { display: grid; }
    .checking .doc.coche .loupe { display: none; }    /* sur un livre coché, la coche prend toute la place */

    /* Le document qu'on vient de cocher s'efface avant de partir en bas de la page */
    .doc.part { transition: opacity .3s, transform .3s; opacity: 0; transform: scale(.85); }

    /* « Déjà récupérés » : section repliée en bas (<details> = repli natif du navigateur) */
    .recup summary {
      list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
      font-size: 15px; font-weight: 800; color: var(--good);
    }
    .recup summary::-webkit-details-marker { display: none; }
    .recup summary::after { content: '▾'; color: var(--muted); transition: transform .2s; }
    .recup[open] summary::after { transform: rotate(180deg); }
    .recup[open] summary { margin-bottom: 12px; }
    .recup .grille { opacity: .8; }

    /* =========================================================
       9. MA CARTE (à présenter au comptoir pour emprunter)
       ========================================================= */
    #carte { width: min(520px, calc(100vw - 16px)); }
    .carte-titre { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
    .carte-titre + h2 { font-size: 22px; font-weight: 800; margin-top: 2px; }
    /* Le code-barres TOUJOURS noir sur blanc, même en thème sombre : sinon le lecteur ne le lit pas.
       La marge blanche autour (« zone calme ») est obligatoire pour la lecture. */
    .code-barres { background: #fff; border-radius: 14px; padding: 18px 16px 12px; margin-top: 14px; text-align: center; }
    .code-barres svg { width: 100%; height: 120px; }
    .code-barres .numero { color: #000; font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; letter-spacing: .12em; margin-top: 8px; }
    .carte-aide { font-size: 13px; color: var(--muted); margin-top: 12px; line-height: 1.5; }
    .champ { width: 100%; margin-top: 12px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line);
             background: var(--bg); color: var(--ink); font: 700 18px 'JetBrains Mono', monospace; letter-spacing: .08em; }
    .champ:focus { outline: none; border-color: var(--accent); }
    .erreur { color: var(--bad); font-size: 13px; font-weight: 700; margin-top: 8px; }
    .lien-discret { font-size: 13px; font-weight: 700; color: var(--muted); text-decoration: underline; padding: 6px; }
    #scan-video { width: 100%; border-radius: 12px; margin-top: 12px; background: #000; aspect-ratio: 4 / 3; object-fit: cover; }

    /* Bilan : la liste des manquants */
    .manquants { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .manquant { display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; padding: 6px; border-radius: 12px; background: var(--soft); }
    .manquant .couv { width: 48px; flex: none; }
    /* Trop petite pour du texte : sans image, juste la tuile de couleur */
    .manquant .couv .repli, .manquant .couv .fixe { display: none; }
    .manquant b { display: block; font-size: 14px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
    .manquant span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
    .bilan-ok { text-align: center; padding: 18px 4px 4px; }
    .bilan-ok strong { display: block; font-size: 44px; }
    .bilan-ok b { display: block; font-size: 18px; font-weight: 800; margin-top: 6px; }
  </style>
  <!-- Compteur de visites de baiji.fr (voir /journal.js) -->
  <script src="/journal.js" defer></script>
</head>
<body>
  <div id="app">
    <header class="top">
      <div>
        <div class="brand">Médiathèque</div>
        <h1 class="titre" id="titre">Chargement…</h1>
      </div>
      <div style="display:flex;gap:4px">
      <!-- Ma carte : la carte de bibliothèque à montrer au comptoir -->
      <button class="icon-btn" id="btn-carte" aria-label="Ma carte de bibliothèque" title="Ma carte">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5v14"/><path d="M8 5v14"/><path d="M12 5v14"/><path d="M17 5v14"/><path d="M21 5v14"/></svg>
      </button>
      <!-- Mode Check : pour récupérer les documents auprès des enfants et voir ce qui manque -->
      <button class="icon-btn" id="btn-check" aria-label="Mode check" aria-pressed="false" title="Check : vérifier qu'on a tout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>
      </button>
      <button class="icon-btn" id="actualiser" aria-label="Actualiser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
      </div>
    </header>

    <div class="bandeau" id="bandeau" hidden></div>
    <section class="card prochain" id="prochain" hidden></section>
    <!-- Barre du mode Check (compteur, progression, boutons) -->
    <section class="card check-barre" id="check-barre" hidden></section>
    <div class="filtres" id="filtres" hidden></div>
    <div id="liste" style="display:flex;flex-direction:column;gap:14px"></div>
    <footer class="pied" id="pied"></footer>
  </div>

  <dialog id="fiche" aria-label="Fiche du document"></dialog>
  <dialog id="bilan" aria-label="Bilan du check"></dialog>
  <dialog id="carte" aria-label="Ma carte de bibliothèque"></dialog>

  <script>
    /* =================================================================
       CONFIGURATION
       ================================================================= */
    const VERSION = '1.5.1';
    const PRETS_URL = 'https://biblio.baiji.fr/prets.json';       // le service du NAS
    const SITE = 'https://mediatheques.paris-saclay.com';
    const PAGE_PRETS = SITE + '/page/user/prets-en-cours?choix_tri_pret_bgm=dra';   // « Mon compte » (pied de page)
    const MEMOIRE = 'mediatheque.donnees';                         // dernières données (hors ligne)
    const MEMOIRE_CARTE = 'mediatheque.carte';                    // numéro de la carte (dans le téléphone seulement)
    const MEMOIRE_CHECK = 'mediatheque.check';                    // documents cochés en mode Check
    const TROP_VIEUX_H = 8;  // le service relit toutes les 3 h : au-delà de 8 h, quelque chose cloche

    /* =================================================================
       PETITS OUTILS
       ================================================================= */
    const $ = (id) => document.getElementById(id);

    // Échappe le texte avant de le mettre dans du HTML. Indispensable : les titres viennent
    // d'un autre site, un caractère comme « < » ne doit jamais être pris pour une balise.
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // '2026-11-14' → date à minuit, heure locale (new Date('2026-11-14') compterait en heure UTC)
    function enDate(iso) {
      const [a, m, j] = iso.split('-').map(Number);
      return new Date(a, m - 1, j);
    }
    function aujourdhui() {
      const d = new Date();
      return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }
    // Nombre de jours entre aujourd'hui et une date (Math.round absorbe le changement d'heure)
    const joursAvant = (iso) => Math.round((enDate(iso) - aujourdhui()) / 86400e3);
    const dateCourte = (iso) => enDate(iso).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }).replace('.', '');
    const dateLongue = (iso) => enDate(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });

    function compteARebours(n) {
      return n < 0 ? `en retard de ${-n} j` : n === 0 ? "aujourd'hui" : n === 1 ? 'demain' : `dans ${n} j`;
    }
    // Mêmes seuils que le dashboard Famille : rouge à 3 jours ou moins, orange dans la semaine
    function couleur(n) {
      return n <= 3 ? 'var(--bad)' : n <= 7 ? 'var(--warn)' : 'var(--muted)';
    }
    // Couleur stable tirée d'un texte : un même type de document a toujours la même tuile
    function teinte(texte) {
      let h = 0;
      for (const c of String(texte)) h = (h * 31 + c.codePointAt(0)) % 360;
      return `hsl(${h} 38% 34%)`;
    }
    // La couverture, ou une tuile avec le titre s'il n'y a pas d'image.
    // no-referrer : le site de la médiathèque n'a pas besoin de savoir d'où vient la demande.
    // differe : dans la grille, on ne charge une image qu'à l'approche de l'écran ; pas dans la fiche.
    function couverture(p, differe = true) {
      const image = /^https:\/\//.test(p.couverture || '')
        ? `<img src="${esc(p.couverture)}" alt=""${differe ? ' loading="lazy"' : ''} referrerpolicy="no-referrer">` : '';
      return `<span class="couv" style="--t:${teinte(p.type)}"><span class="repli">${esc(p.titre)}</span>${image}`
           + '</span>';
    }

    /* =================================================================
       ÉTAT DE L'APPLI
       ================================================================= */
    let tous = [];                                  // tous les prêts, à plat
    let plusieursCartes = false;
    let inconnu = false;          // true = le site n'a pas donné les prêts (on ne sait pas ce qui est emprunté)
    const filtre = { type: null, mediatheque: null };   // null = pas de filtre

    /* Mode Check. Les coches sont gardées dans le téléphone (localStorage) : si on ferme
       l'appli au milieu du tour des chambres, on retrouve tout en la rouvrant.
       Une coche est enregistrée par « clé » de document (voir cleDoc). */
    let enCheck = false;
    let coches = new Set();
    try {
      const m = JSON.parse(localStorage.getItem(MEMOIRE_CHECK));
      if (m) { enCheck = !!m.actif; coches = new Set(m.coches || []); }
    } catch { /* rien de gardé : on part de zéro */ }

    function sauverCheck() {
      try { localStorage.setItem(MEMOIRE_CHECK, JSON.stringify({ actif: enCheck, coches: [...coches] })); } catch { /* tant pis */ }
    }
    // Un identifiant stable pour chaque prêt. Le service ne donne pas de numéro : on assemble
    // carte + titre + auteur + date d'emprunt. Pas la date de retour : elle change quand on prolonge.
    const cleDoc = (p) => [p.qui, p.titre, p.auteur, p.emprunt].join('|');
    let recupOuvert = false;      // la section « Déjà récupérés » est-elle dépliée ?
    let minuteurListe = null;     // réaffichage différé après une coche (voir cocher)

    /* =================================================================
       AFFICHAGE
       ================================================================= */
    function afficher(donnees, horsLigne) {
      const cartes = donnees.cartes || [];
      plusieursCartes = cartes.length > 1;
      // On met tous les prêts dans une seule liste, en notant à quelle carte ils appartiennent
      tous = cartes.flatMap((c) => (c.prets || []).map((p) => ({ ...p, qui: c.nom })));
      tous.sort((a, b) => String(a.retour || '9999').localeCompare(String(b.retour || '9999')) || String(a.titre).localeCompare(b.titre, 'fr'));

      // Le filtre choisi n'existe plus (document rendu entre-temps) : on l'enlève
      if (!tous.some((p) => p.type === filtre.type)) filtre.type = null;
      if (!tous.some((p) => p.mediatheque === filtre.mediatheque)) filtre.mediatheque = null;

      // Une carte en erreur sans aucun prêt connu : on ne SAIT pas ce qui est emprunté
      inconnu = !tous.length && cartes.some((c) => !c.ok);
      $('titre').textContent = tous.length ? `${tous.length} document${tous.length > 1 ? 's' : ''}` : inconnu ? 'Liste indisponible' : 'Aucun emprunt';
      afficherBandeau(donnees, cartes, horsLigne);
      afficherProchain();
      afficherFiltres();
      // Document rendu à la médiathèque entre-temps : sa coche ne sert plus, on l'oublie
      const cles = new Set(tous.map(cleDoc));
      for (const c of [...coches]) if (!cles.has(c)) coches.delete(c);
      sauverCheck();
      afficherCheck();
      afficherListe();

      const maj = donnees.updated ? new Date(donnees.updated) : null;
      $('pied').innerHTML = (maj ? `Site relu ${esc(ilYa(maj))} · relecture toutes les 3 h<br>` : '')
        + `<a href="${esc(PAGE_PRETS)}" target="_blank" rel="noopener" style="color:inherit">Mon compte sur le site</a> · v${VERSION}`;
    }

    function ilYa(date) {
      const min = Math.round((Date.now() - date) / 60e3);
      if (min < 2) return "à l'instant";
      if (min < 60) return `il y a ${min} min`;
      if (min < 48 * 60) return `il y a ${Math.round(min / 60)} h`;
      return `il y a ${Math.round(min / 1440)} j`;
    }

    function afficherBandeau(donnees, cartes, horsLigne) {
      const age = donnees.updated ? (Date.now() - new Date(donnees.updated)) / 3600e3 : 0;
      let message = '';
      if (horsLigne) message = '⚠ Service injoignable : dernières données connues, peut-être dépassées.';
      else if (cartes.some((c) => !c.ok)) message = '⚠ La dernière connexion au site a échoué : ces données ne sont peut-être plus à jour.';
      else if (age > TROP_VIEUX_H) message = '⚠ Le service n\'a pas relu le site depuis plusieurs heures.';
      $('bandeau').hidden = !message;
      $('bandeau').textContent = message;
    }

    function afficherProchain() {
      const avecDate = tous.filter((p) => p.retour);
      $('prochain').hidden = !avecDate.length;
      if (!avecDate.length) return;
      const iso = avecDate[0].retour;                      // la liste est triée : le plus urgent d'abord
      const nb = avecDate.filter((p) => p.retour === iso).length;
      const n = joursAvant(iso);
      $('prochain').style.setProperty('--c', couleur(n));
      $('prochain').innerHTML = `<div><small>Prochain retour</small><b>${esc(dateCourte(iso))}</b>`
        + `<span>${esc(compteARebours(n))} · ${nb} document${nb > 1 ? 's' : ''}</span></div>`;
    }

    function afficherFiltres() {
      // Une ligne de pastilles par critère, seulement s'il y a un vrai choix (au moins 2 valeurs)
      const pastilles = (cle) => {
        const compte = {};
        for (const p of tous) if (p[cle]) compte[p[cle]] = (compte[p[cle]] || 0) + 1;
        const valeurs = Object.keys(compte).sort((a, b) => compte[b] - compte[a] || a.localeCompare(b, 'fr'));
        return valeurs.length < 2 ? '' : valeurs.map((v) =>
          `<button class="filtre" data-cle="${cle}" data-valeur="${esc(v)}" aria-pressed="${filtre[cle] === v}">${esc(v)}<em>${compte[v]}</em></button>`).join('');
      };
      const html = pastilles('type') + pastilles('mediatheque');
      $('filtres').hidden = !html;
      $('filtres').innerHTML = html;
    }

    function afficherListe() {
      if (inconnu) {
        $('liste').innerHTML = '<section class="card vide"><strong>⏳</strong>Le site des médiathèques ne donne pas la liste des prêts pour le moment. Le service réessaie toutes les 30 minutes.</section>';
        return;
      }
      if (!tous.length) {
        $('liste').innerHTML = '<section class="card vide"><strong>📚</strong>Rien à rendre : c\'est le moment d\'aller en emprunter !</section>';
        return;
      }
      let visibles = tous.filter((p) => (!filtre.type || p.type === filtre.type) && (!filtre.mediatheque || p.mediatheque === filtre.mediatheque));

      // Mode Check : les documents cochés sortent des groupes et vont tout en bas,
      // dans une section repliée. Les groupes ne montrent donc que ce qui manque.
      let recuperes = [];
      if (enCheck) {
        recuperes = visibles.filter((p) => coches.has(cleDoc(p)));
        visibles = visibles.filter((p) => !coches.has(cleDoc(p)));
      }

      // On regroupe par date de retour, en gardant l'ordre (la liste est déjà triée)
      const groupes = new Map();
      for (const p of visibles) {
        const cle = p.retour || '?';
        if (!groupes.has(cle)) groupes.set(cle, []);
        groupes.get(cle).push(p);
      }

      // Un document de la grille (même modèle partout, cochés ou non)
      const tuile = (p) => `<button class="doc${coches.has(cleDoc(p)) ? ' coche' : ''}" data-i="${tous.indexOf(p)}" ${enCheck ? `aria-pressed="${coches.has(cleDoc(p))}"` : ''}>
            ${couverture(p).replace(/<\/span>$/, COCHE + LOUPE + '</span>')}
            <span class="t">${esc(p.titre)}</span>
            ${p.auteur ? `<span class="a">${esc(p.auteur)}</span>` : ''}
          </button>`;

      $('liste').innerHTML = [...groupes].map(([iso, docs]) => {
        const connue = iso !== '?';
        const n = connue ? joursAvant(iso) : null;
        return `<section class="card">
          <div class="groupe-titre" style="--c:${connue ? couleur(n) : 'var(--muted)'}">
            <h2>${connue ? 'À rendre ' + esc(dateCourte(iso)) : 'Date inconnue'}</h2>
            <span>${connue ? esc(compteARebours(n)) + ' · ' : ''}${docs.length}</span>
          </div>
          <div class="grille">${docs.map(tuile).join('')}</div>
        </section>`;
      }).join('')
      // Plus rien à chercher (dans ce filtre) : un petit mot à la place des groupes
      + (enCheck && !visibles.length && recuperes.length
          ? '<section class="card vide"><strong>🎉</strong>Tout est récupéré ! Touche « Terminer » pour le bilan.</section>' : '')
      // La section repliée des récupérés, ouverte seulement si on l'avait ouverte
      + (recuperes.length ? `<details class="card recup"${recupOuvert ? ' open' : ''}>
          <summary>✓ Déjà récupérés · ${recuperes.length}</summary>
          <div class="grille">${recuperes.map(tuile).join('')}</div>
        </details>` : '');
    }

    /* =================================================================
       MODE CHECK
       On touche chaque document récupéré : il se coche (voile vert).
       « Terminer » ouvre le bilan avec ceux qui manquent.
       ================================================================= */
    // La grosse coche posée sur la couverture (cachée par le CSS tant que le doc n'est pas coché)
    const COCHE = '<span class="coche-ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>';

    // La loupe (un <span> et pas un <button> : on ne peut pas mettre un bouton dans un bouton)
    const LOUPE = '<span class="loupe" aria-label="Voir en grand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></span>';

    function afficherCheck() {
      $('btn-check').setAttribute('aria-pressed', enCheck);
      document.body.classList.toggle('checking', enCheck);     // le CSS grise / coche les couvertures
      $('check-barre').hidden = !enCheck || !tous.length;
      if (!enCheck || !tous.length) return;
      const nb = tous.filter((p) => coches.has(cleDoc(p))).length;
      const reste = tous.length - nb;
      $('check-barre').innerHTML = `
        <div class="check-haut">
          <div><small>Récupérés</small>
            <b class="mono">${nb} / ${tous.length}</b></div>
          <span style="font-size:14px;font-weight:700;color:${reste ? 'var(--muted)' : 'var(--good)'}">
            ${reste ? `${reste} à récupérer` : 'Tout est là ✓'}</span>
        </div>
        <div class="duree" aria-hidden="true"><i style="width:${(nb / tous.length * 100).toFixed(0)}%"></i></div>
        <div class="check-boutons">
          <button class="btn secondaire" id="check-zero">Recommencer</button>
          <button class="btn" id="check-fin">Terminer</button>
        </div>`;
    }

    function basculerCheck() {
      enCheck = !enCheck;
      sauverCheck();
      afficherCheck();
      afficherListe();
      if (enCheck) $('check-barre').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Toucher une couverture en mode Check : on coche (ou décoche), le document affiche la
    // coche verte un court instant, s'efface, puis la liste est redessinée : il rejoint
    // « Déjà récupérés » en bas (ou revient à sa place s'il était décoché).
    function cocher(bouton, p) {
      const cle = cleDoc(p);
      if (coches.has(cle)) coches.delete(cle); else coches.add(cle);
      bouton.classList.toggle('coche', coches.has(cle));
      bouton.setAttribute('aria-pressed', coches.has(cle));
      if (navigator.vibrate) navigator.vibrate(15);              // petit retour au doigt sur Android
      sauverCheck();
      afficherCheck();
      setTimeout(() => bouton.classList.add('part'), 250);        // on laisse voir la coche, puis fondu
      // Un seul réaffichage, 0,6 s après la DERNIÈRE coche : si on enchaîne plusieurs livres
      // vite, la grille ne bouge pas sous le doigt entre deux touches.
      clearTimeout(minuteurListe);
      minuteurListe = setTimeout(afficherListe, 600);
    }

    // Le bilan : tous les documents non cochés, groupés par enfant si plusieurs cartes,
    // triés par date de retour (le plus urgent d'abord : c'est celui qu'il faut retrouver vite)
    function ouvrirBilan() {
      const manquants = tous.filter((p) => !coches.has(cleDoc(p)));
      const contenu = manquants.length
        ? `<div class="fiche-haut"><h2>${manquants.length} document${manquants.length > 1 ? 's' : ''} manquant${manquants.length > 1 ? 's' : ''}</h2>
             <p>${tous.length - manquants.length} sur ${tous.length} récupérés. Touche un document pour voir sa fiche.</p></div>
           <div class="manquants">${manquants.map((p) => {
             const n = p.retour ? joursAvant(p.retour) : null;
             return `<button class="manquant" data-i="${tous.indexOf(p)}">${couverture(p, false)}
               <div><b>${esc(p.titre)}</b>
                 ${p.auteur ? `<span>${esc(p.auteur)}</span>` : ''}
                 <span>${plusieursCartes ? esc(p.qui) + ' · ' : ''}${p.retour ? `à rendre ${esc(dateCourte(p.retour))} · <span style="display:inline;color:${couleur(n)}">${esc(compteARebours(n))}</span>` : ''}</span>
               </div></button>`;
           }).join('')}</div>`
        : `<div class="bilan-ok"><strong>🎉</strong><b>Tout est là !</b>
             <p style="color:var(--muted);margin-top:4px">Les ${tous.length} documents ont été récupérés.</p></div>`;

      $('bilan').innerHTML = `
        <button class="icon-btn fermer" id="fermer-bilan" aria-label="Fermer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
        ${contenu}
        <div class="boutons">
          ${manquants.length
            ? `<button class="btn" id="bilan-continuer">Continuer à chercher</button>
               ${navigator.share ? '<button class="btn secondaire" id="bilan-partager">Envoyer la liste</button>' : ''}`
            : ''}
          <button class="btn ${manquants.length ? 'secondaire' : ''}" id="bilan-quitter">Quitter le check</button>
        </div>`;
      $('bilan').showModal();
      history.pushState({ fiche: true }, '');            // retour du téléphone = fermer le bilan
    }

    // « Envoyer la liste » : feuille de partage d'Android (WhatsApp, SMS…), par exemple aux enfants
    function partagerManquants() {
      const manquants = tous.filter((p) => !coches.has(cleDoc(p)));
      const texte = '📚 Livres de la médiathèque à retrouver :\n'
        + manquants.map((p) => `• ${p.titre}${p.auteur ? ' (' + p.auteur + ')' : ''}${p.retour ? ' — à rendre ' + dateCourte(p.retour) : ''}`).join('\n');
      navigator.share({ text: texte }).catch(() => {});    // annulé par l'utilisateur : rien à faire
    }

    /* =================================================================
       FICHE D'UN DOCUMENT
       ================================================================= */
    function ouvrirFiche(p, pousser = true) {   // pousser = ajouter une étape à l'historique
      const n = p.retour ? joursAvant(p.retour) : null;
      // Part de la durée du prêt déjà écoulée, entre 0 et 100 %
      let part = null;
      if (p.emprunt && p.retour) {
        const total = enDate(p.retour) - enDate(p.emprunt);
        part = total > 0 ? Math.min(100, Math.max(0, (aujourdhui() - enDate(p.emprunt)) / total * 100)) : 100;
      }
      const ligne = (nom, valeur) => valeur ? `<div><dt>${esc(nom)}</dt><dd>${valeur}</dd></div>` : '';
      const catalogue = `${SITE}/recherche---catalogue?q=${encodeURIComponent(p.titre)}`;

      $('fiche').innerHTML = `
        <button class="icon-btn fermer" id="fermer" aria-label="Fermer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
        <div class="fiche-visuel">${couverture(p, false)}</div>
        <div class="fiche-haut">
          <h2>${esc(p.titre)}</h2>
          ${p.auteur ? `<p>${esc(p.auteur)}</p>` : ''}
          ${p.type ? `<span class="etiquette">${esc(p.type)}</span>` : ''}
        </div>
        <dl class="lignes">
          ${plusieursCartes ? ligne('Carte', esc(p.qui)) : ''}
          ${ligne('Médiathèque', esc(p.mediatheque))}
          ${ligne('Emprunté le', p.emprunt ? esc(dateLongue(p.emprunt)) : '')}
          ${ligne('À rendre le', p.retour ? `${esc(dateLongue(p.retour))}<br><span style="color:${couleur(n)}">${esc(compteARebours(n))}</span>` : '')}
        </dl>
        ${part !== null ? `<div class="duree" style="--c:${couleur(n)}" aria-hidden="true"><i style="width:${part.toFixed(0)}%"></i></div>` : ''}
        <div class="boutons">
          ${enCheck ? (coches.has(cleDoc(p))
              ? `<button class="btn secondaire" id="fiche-cocher" data-i="${tous.indexOf(p)}">Pas récupéré finalement</button>`
              : `<button class="btn" id="fiche-cocher" data-i="${tous.indexOf(p)}" style="background:var(--good)">✓ Récupéré</button>`) : ''}
          <a class="btn secondaire" href="${esc(catalogue)}" target="_blank" rel="noopener">Voir dans le catalogue ↗</a>
        </div>`;
      $('fiche').showModal();
      // On ajoute une étape à l'historique : le bouton « retour » du téléphone fermera la fiche
      if (pousser) history.pushState({ fiche: true }, '');
    }

    /* =================================================================
       CHARGEMENT
       ================================================================= */
    async function charger() {
      $('actualiser').classList.add('spin');
      try {
        const reponse = await fetch(PRETS_URL, { cache: 'no-store' });
        if (!reponse.ok) throw new Error('HTTP ' + reponse.status);
        const donnees = await reponse.json();
        // Le service vient de démarrer et n'a encore rien lu : on garde ce qu'on avait
        if (!donnees.updated && lireMemoire()) throw new Error('première lecture en cours');
        // Carte en erreur ET liste vide (le site n'a pas donné les prêts) : plutôt que d'afficher
        // « 0 document », on reprend pour cette carte les derniers prêts gardés dans le téléphone.
        const memoire = lireMemoire();
        for (const c of donnees.cartes || []) {
          if (!c.ok && !(c.prets || []).length) {
            const ancienne = memoire && (memoire.cartes || []).find((m) => m.nom === c.nom);
            if (ancienne && (ancienne.prets || []).length) c.prets = ancienne.prets;
          }
        }
        try { localStorage.setItem(MEMOIRE, JSON.stringify(donnees)); } catch { /* stockage indisponible : tant pis */ }
        afficher(donnees, false);
      } catch {
        // Pas de réseau ou NAS éteint : on ressort les dernières données connues
        const memoire = lireMemoire();
        if (memoire) afficher(memoire, true);
        else {
          $('titre').textContent = 'Service injoignable';
          $('liste').innerHTML = '<section class="card vide"><strong>📡</strong>Impossible de joindre le service de la maison. Réessaie un peu plus tard.</section>';
        }
      }
      $('actualiser').classList.remove('spin');
    }

    function lireMemoire() {
      try { return JSON.parse(localStorage.getItem(MEMOIRE)); } catch { return null; }
    }

    /* =================================================================
       ÉVÉNEMENTS
       Un seul écouteur sur chaque zone : plus simple que d'en poser un
       sur chaque bouton, qui sont recréés à chaque affichage.
       ================================================================= */
    $('actualiser').addEventListener('click', charger);

    $('filtres').addEventListener('click', (e) => {
      const b = e.target.closest('.filtre');
      if (!b) return;
      const { cle, valeur } = b.dataset;
      filtre[cle] = filtre[cle] === valeur ? null : valeur;     // retoucher une pastille enlève le filtre
      afficherFiltres();
      afficherListe();
    });

    $('liste').addEventListener('click', (e) => {
      const b = e.target.closest('.doc');
      if (!b) return;
      // En mode Check, toucher = cocher, sauf sur la loupe qui ouvre la fiche ;
      // hors mode Check, toucher = ouvrir la fiche
      if (enCheck && !e.target.closest('.loupe')) cocher(b, tous[Number(b.dataset.i)]);
      else ouvrirFiche(tous[Number(b.dataset.i)]);
    });

    $('liste').addEventListener('toggle', (e) => {
      if (e.target.classList.contains('recup')) recupOuvert = e.target.open;
    }, true);

    $('btn-check').addEventListener('click', basculerCheck);
    $('check-barre').addEventListener('click', (e) => {
      if (e.target.closest('#check-fin')) ouvrirBilan();
      if (e.target.closest('#check-zero')) {
        coches.clear(); sauverCheck(); afficherCheck(); afficherListe();
      }
    });
    $('bilan').addEventListener('click', (e) => {
      const m = e.target.closest('.manquant');
      if (m) {
        // On passe du bilan à la fiche du document : on ferme le bilan sans toucher à
        // l'historique, et la fiche réutilise l'étape qu'il avait ajoutée
        bilanVersFiche = true; $('bilan').close();   // remis à false par l'écouteur « close » ci-dessous
        ouvrirFiche(tous[Number(m.dataset.i)], false);
        return;
      }
      if (e.target === $('bilan') || e.target.closest('#fermer-bilan') || e.target.closest('#bilan-continuer')) $('bilan').close();
      if (e.target.closest('#bilan-partager')) partagerManquants();
      if (e.target.closest('#bilan-quitter')) {
        $('bilan').close();
        coches.clear(); enCheck = false; sauverCheck(); afficherCheck(); afficherListe();
      }
    });
    let bilanVersFiche = false;
    // Attention : l'événement « close » arrive un peu APRÈS l'appel à close() (il est mis en file
    // d'attente). C'est donc ici, et pas juste après close(), qu'on remet le drapeau à false.
    $('bilan').addEventListener('close', () => {
      if (bilanVersFiche) { bilanVersFiche = false; return; }
      if (history.state && history.state.fiche) history.back();
    });

    $('fiche').addEventListener('click', (e) => {
      // Clic sur la croix, ou sur le fond sombre (la cible est alors le <dialog> lui-même)
      if (e.target === $('fiche') || e.target.closest('#fermer')) $('fiche').close();
      // « Récupéré » depuis la fiche (mode Check) : on coche / décoche, on ferme et on redessine
      const c = e.target.closest('#fiche-cocher');
      if (c) {
        const cle = cleDoc(tous[Number(c.dataset.i)]);
        if (coches.has(cle)) coches.delete(cle); else coches.add(cle);
        if (navigator.vibrate) navigator.vibrate(15);
        sauverCheck(); afficherCheck(); afficherListe();
        $('fiche').close();
      }
    });
    /* =================================================================
       MA CARTE DE BIBLIOTHÈQUE
       La carte des Médiathèques de Paris-Saclay porte un code-barres CODABAR,
       le format classique des bibliothèques. Le numéro n'est PAS écrit dans ce
       fichier (le dépôt GitHub est public) : il est gardé dans le téléphone
       (localStorage), saisi une fois, scanné, ou donné par un lien ?carte=…
       ================================================================= */

    // Codabar : chaque caractère = 7 traits qui alternent barre, espace, barre, espace…
    // 0 = trait fin, 1 = trait large. Entre deux caractères : un espace fin.
    // Un code commence et finit par une lettre A, B, C ou D (« start » et « stop »).
    const CODABAR = {
      '0': '0000011', '1': '0000110', '2': '0001001', '3': '1100000', '4': '0010010',
      '5': '1000010', '6': '0100001', '7': '0100100', '8': '0110000', '9': '1001000',
      '-': '0001100', '$': '0011000', ':': '1000101', '/': '1010001', '.': '1010100', '+': '0010101',
      'A': '0011010', 'B': '0101001', 'C': '0001011', 'D': '0001110',
    };

    // Dessine le code-barres en SVG. Les traits larges font 3 fois les fins (rapport conseillé).
    // shape-rendering="crispEdges" : bords nets, sans flou, pour l'appareil de lecture.
    function codabarSVG(texte) {
      const FIN = 2, LARGE = 6, CALME = 20;   // CALME = marge blanche obligatoire de chaque côté
      let x = CALME, barres = '';
      [...texte].forEach((car, i) => {
        [...CODABAR[car]].forEach((large, j) => {
          const l = large === '1' ? LARGE : FIN;
          if (j % 2 === 0) barres += `<rect x="${x}" width="${l}" height="100"/>`;   // positions paires = barres
          x += l;                                                                    // impaires = espaces
        });
        if (i < texte.length - 1) x += FIN;  // espace entre deux caractères
      });
      return `<svg viewBox="0 0 ${x + CALME} 100" preserveAspectRatio="none" shape-rendering="crispEdges" aria-hidden="true"><g fill="#000">${barres}</g></svg>`;
    }

    // Nettoie ce qu'on a tapé ou scanné. Rend {debut, numero, fin} ou null si ce n'est pas du Codabar.
    // Sans lettres de début/fin, on met A…B, comme sur la carte d'origine.
    function lireNumero(brut) {
      const t = String(brut || '').toUpperCase().replace(/\s+/g, '');
      const m = /^([ABCD])?([0-9\-$:\/.+]{4,30})([ABCD])?$/.exec(t);
      return m ? { debut: m[1] || 'A', numero: m[2], fin: m[3] || 'B' } : null;
    }
    function lireCarte() {
      try { return JSON.parse(localStorage.getItem(MEMOIRE_CARTE)); } catch { return null; }
    }
    function sauverCarte(c) {
      try { localStorage.setItem(MEMOIRE_CARTE, JSON.stringify(c)); return true; } catch { return false; }
    }

    // Garder l'écran allumé pendant qu'on montre la carte (sinon il s'éteint devant le lecteur)
    let verrouEcran = null;
    async function garderEcranAllume(oui) {
      try {
        if (oui && 'wakeLock' in navigator) verrouEcran = await navigator.wakeLock.request('screen');
        else if (!oui && verrouEcran) { await verrouEcran.release(); verrouEcran = null; }
      } catch { /* refusé (batterie faible…) : pas grave */ }
    }

    const CROIX = `<button class="icon-btn fermer" data-fermer aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>`;

    // Ouvre la fenêtre : la carte si on a un numéro, sinon le formulaire pour l'enregistrer
    function ouvrirCarte(enModif = false) {
      const c = lireCarte();
      if (c && !enModif) {
        $('carte').innerHTML = `${CROIX}
          <div class="carte-titre">Médiathèques Paris-Saclay</div>
          <h2>Carte de bibliothèque</h2>
          <div class="code-barres">
            ${codabarSVG(c.debut + c.numero + c.fin)}
            <div class="numero">${esc(c.numero)}</div>
          </div>
          <p class="carte-aide">Présente cet écran au lecteur de la borne ou du comptoir.
            Monte la luminosité si le code ne passe pas du premier coup.</p>
          <div class="boutons">
            <!-- Le site des médiathèques : catalogue, réservations, horaires -->
            <a class="btn secondaire" href="${esc(SITE)}" target="_blank" rel="noopener">Site des médiathèques ↗</a>
            <button class="lien-discret" id="carte-modifier">Changer de numéro</button>
          </div>`;
        garderEcranAllume(true);
      } else {
        // BarcodeDetector = lecteur de codes-barres intégré à Chrome sur Android (pas partout)
        const scan = 'BarcodeDetector' in window;
        $('carte').innerHTML = `${CROIX}
          <div class="carte-titre">Ma carte</div>
          <h2>${c ? 'Changer de numéro' : 'Enregistrer ta carte'}</h2>
          <p class="carte-aide">Le numéro est sous le code-barres de ta carte. Il reste dans ce téléphone :
            il n'est envoyé nulle part.</p>
          <input class="champ" id="carte-numero" inputmode="numeric" autocomplete="off" placeholder="Numéro de carte" value="${c ? esc(c.numero) : ''}">
          <div class="erreur" id="carte-erreur" hidden></div>
          <video id="scan-video" playsinline muted hidden></video>
          <div class="boutons">
            <button class="btn" id="carte-ok">Enregistrer</button>
            ${scan ? '<button class="btn secondaire" id="carte-scan">📷 Scanner ma carte</button>' : ''}
            ${c ? '<button class="lien-discret" id="carte-oublier">Oublier ma carte sur ce téléphone</button>' : ''}
          </div>`;
      }
      if (!$('carte').open) {
        $('carte').showModal();
        history.pushState({ fiche: true }, '');   // retour du téléphone = fermer la carte
      }
    }

    // Lecture de la carte en plastique avec la caméra
    let flux = null;
    async function scannerCarte() {
      const video = $('scan-video'), erreur = $('carte-erreur');
      try {
        const lecteur = new BarcodeDetector({ formats: ['codabar'] });
        flux = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });  // caméra arrière
        video.srcObject = flux; video.hidden = false; await video.play();
        erreur.hidden = true;
        // On regarde l'image 4 fois par seconde jusqu'à trouver un code (ou fermeture de la fenêtre)
        while (flux) {
          const trouves = await lecteur.detect(video).catch(() => []);
          const c = trouves.length && lireNumero(trouves[0].rawValue);
          if (c) {
            arreterScan();
            sauverCarte(c);
            if (navigator.vibrate) navigator.vibrate(40);
            ouvrirCarte();
            return;
          }
          await new Promise((r) => setTimeout(r, 250));
        }
      } catch {
        arreterScan();
        erreur.textContent = 'Caméra indisponible : tape le numéro à la main.';
        erreur.hidden = false;
      }
    }
    function arreterScan() {
      if (flux) flux.getTracks().forEach((t) => t.stop());   // éteint vraiment la caméra
      flux = null;
      if ($('scan-video')) $('scan-video').hidden = true;
    }

    $('btn-carte').addEventListener('click', () => ouvrirCarte());
    $('carte').addEventListener('click', (e) => {
      if (e.target === $('carte') || e.target.closest('[data-fermer]')) $('carte').close();
      if (e.target.closest('#carte-modifier')) { garderEcranAllume(false); ouvrirCarte(true); }
      if (e.target.closest('#carte-scan')) scannerCarte();
      if (e.target.closest('#carte-oublier')) {
        try { localStorage.removeItem(MEMOIRE_CARTE); } catch { /* rien */ }
        $('carte').close();
      }
      if (e.target.closest('#carte-ok')) {
        const c = lireNumero($('carte-numero').value);
        if (!c) {
          $('carte-erreur').textContent = 'Ce numéro ne ressemble pas à un numéro de carte (des chiffres, au moins 4).';
          $('carte-erreur').hidden = false;
          return;
        }
        arreterScan(); sauverCarte(c); ouvrirCarte();
      }
    });
    // Touche « Entrée » du clavier = Enregistrer
    $('carte').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.id === 'carte-numero') { e.preventDefault(); $('carte-ok').click(); }
    });
    $('carte').addEventListener('close', () => {
      arreterScan(); garderEcranAllume(false);
      if (history.state && history.state.fiche) history.back();
    });

    // Lien d'installation : baiji.fr/mediatheque/?carte=NUMERO enregistre le numéro puis
    // l'efface de l'adresse (pour qu'il ne reste ni dans l'historique ni dans un favori).
    // baiji.fr/mediatheque/?carte (sans numéro) ouvre directement la carte : pratique en raccourci.
    {
      const params = new URLSearchParams(location.search);
      if (params.has('carte')) {
        const c = lireNumero(params.get('carte'));
        if (c) sauverCarte(c);
        history.replaceState(null, '', location.pathname);
        ouvrirCarte();
      }
    }

    // Fiche fermée (croix, touche Échap…) : on retire l'étape ajoutée à l'historique
    $('fiche').addEventListener('close', () => { if (history.state && history.state.fiche) history.back(); });
    // Bouton « retour » du téléphone : on ferme la fiche au lieu de quitter l'appli
    window.addEventListener('popstate', () => {
      if ($('fiche').open) $('fiche').close();
      if ($('bilan').open) $('bilan').close();
      if ($('carte').open) $('carte').close();
    });

    // Image absente ou en erreur : on l'enlève, la tuile avec le titre apparaît dessous.
    // « true » est obligatoire : l'événement error d'une image ne remonte pas tout seul.
    document.addEventListener('error', (e) => { if (e.target.tagName === 'IMG') e.target.remove(); }, true);

    // Retour sur l'appli après 10 minutes : on recharge
    let derniere = Date.now();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && Date.now() - derniere > 10 * 60e3) { derniere = Date.now(); charger(); }
    });

    // Service worker : rend l'appli installable et utilisable hors ligne
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

    charger();
  </script>
</body>
</html>
